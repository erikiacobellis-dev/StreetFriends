          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeRect(px, py, pSize, pSize);

          // Nome e statistiche
          const sx = px + pSize + 10;
          ctx.textAlign = 'left';
          ctx.font = '13px "Press Start 2P", monospace';
          ctx.fillStyle = f.border;
          ctx.fillText(info.name, sx, py + 18);

          const statList = [
            { label: 'FORZA', val: info.stats.forza, col: '#ff5964' },
            { label: 'VELOC.', val: info.stats.velocita, col: '#5ce1e6' },
            { label: 'FOLLIA', val: info.stats.follia, col: '#ffd541' }
          ];
          statList.forEach((st, sIdx) => {
            const sy = py + 38 + sIdx * 26;
            ctx.font = '7px "Press Start 2P", monospace';
            ctx.fillStyle = '#dbe4ff';
            ctx.fillText(st.label, sx, sy);
            ctx.fillStyle = '#1f2947';
            ctx.fillRect(sx, sy + 4, 96, 8);
            ctx.fillStyle = st.col;
            ctx.fillRect(sx, sy + 4, Math.round((st.val / 100) * 96), 8);
          });

          // Mossa Segreta
          ctx.fillStyle = 'rgba(0, 0, 0, 0.58)';
          ctx.fillRect(f.x + 8, f.y + 136, f.w - 16, 58);
          ctx.textAlign = 'center';
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = '#aab8e6';
          ctx.fillText('MOSSA SEGRETA:', f.x + f.w / 2, f.y + 151);

          ctx.font = '9px "Press Start 2P", monospace';
          ctx.fillStyle = f.accent;
          ctx.fillText(info.specialName, f.x + f.w / 2, f.y + 168);

          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffffff';
          ctx.fillText(f.desc, f.x + f.w / 2, f.y + 184);
        });

        // Badge VS centrale
        const vsPulse = 1 + Math.sin(this.globalTime * 8) * 0.08;
        ctx.save();
        ctx.translate(w / 2, 172);
        ctx.scale(vsPulse, vsPulse);
        ctx.textAlign = 'center';
        ctx.font = '26px "Press Start 2P", monospace';
        ctx.fillStyle = '#660000';
        ctx.fillText('VS', 3, 10 + 3);
        ctx.fillStyle = '#ffcf40';
        ctx.fillText('VS', 0, 10);
        ctx.restore();

        // Barra inferiore Modalità + INSERT COIN / FIGHT!
        ctx.fillStyle = 'rgba(15, 22, 46, 0.95)';
        ctx.fillRect(24, 284, w - 48, 36);
        ctx.strokeStyle = '#ffd541';
        ctx.lineWidth = 2;
        ctx.strokeRect(24, 284, w - 48, 36);

        ctx.font = '9px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = this.modeCursor === 0 ? '#ffd541' : '#6c78a6';
        ctx.fillText(this.modeCursor === 0 ? '▶ 1P VS CPU' : '  1P VS CPU', 142, 306);

        ctx.fillStyle = this.modeCursor === 1 ? '#5ce1e6' : '#6c78a6';
        ctx.fillText(this.modeCursor === 1 ? '▶ 2P LOCALE' : '  2P LOCALE', 310, 306);

        if (Math.floor(this.globalTime * 3) % 2 === 0) {
          ctx.fillStyle = '#ff5964';
          ctx.fillText('INSERT COIN / FIGHT!', 500, 306);
        } else {
          ctx.fillStyle = '#ffd541';
          ctx.fillText('▶ COMBATTI ORA! ◀', 500, 306);
        }

        ctx.font = '7px "Press Start 2P", monospace';
        ctx.fillStyle = '#cbd5ff';
        ctx.fillText('[◀/▶] Scegli Lottatore  •  [▲/▼] Modalità  •  Tocca una scheda o FIGHT!', w / 2, 338);
      },

      renderProjectiles() {
        this.projectiles.forEach((p) => {
          ctx.save();
          ctx.translate(Math.round(p.x), Math.round(p.y));

          if (p.kind === 'EYEBALL') {
            // Scia energetica dell'occhio volante di Pigna
            ctx.fillStyle = 'rgba(255, 89, 100, 0.45)';
            ctx.beginPath();
            ctx.ellipse(-Math.sign(p.vx) * 18, 0, 22, 11, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.rotate(p.spin);
            // Bulbo oculare gigante
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#d90429';
            ctx.stroke();

            // Venuzze rosse
            ctx.strokeStyle = '#ef233c';
            ctx.beginPath();
            ctx.moveTo(-12, -4);
            ctx.lineTo(-6, -2);
            ctx.moveTo(-10, 6);
            ctx.lineTo(-5, 3);
            ctx.stroke();

            // Iride castana e pupilla
            ctx.fillStyle = '#4a2511';
            ctx.beginPath();
            ctx.arc(5, 0, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(6, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(3, -3, 3, 3);
          } else {
            // MANO-RAZZO LEGO!
            const dir = Math.sign(p.vx);
            // Fiamma propulsore posteriore
            ctx.fillStyle = Math.floor(this.globalTime * 30) % 2 === 0 ? '#ff5964' : '#ffd541';
            ctx.beginPath();
            ctx.moveTo(-dir * 10, -6);
            ctx.lineTo(-dir * (24 + Math.random() * 8), 0);
            ctx.lineTo(-dir * 10, 6);
            ctx.closePath();
            ctx.fill();

            ctx.scale(dir, 1);
            // Polso cilindrico Lego
            ctx.fillStyle = '#d99e00';
            ctx.fillRect(-11, -5, 6, 10);
            // Pinza a C giallo Lego
            ctx.fillStyle = '#ffcf00';
            ctx.beginPath();
            ctx.arc(3, 0, 12, 0.55, Math.PI * 2 - 0.55);
            ctx.lineTo(4, -5);
            ctx.arc(3, 0, 5.5, Math.PI * 2 - 0.65, 0.65, true);
            ctx.closePath();
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#7a4b00';
            ctx.stroke();
          }

          ctx.restore();
        });
      },

      renderEffects() {
        this.effects.forEach((ef) => {
          if (ef.type === 'spark') {
            ctx.fillStyle = ef.color;
            ctx.fillRect(Math.round(ef.x - 3), Math.round(ef.y - 3), 6, 6);
          } else if (ef.type === 'callout') {
            ctx.font = '10px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#000';
            ctx.fillText(ef.text, Math.round(ef.x) + 2, Math.round(ef.y) + 2);
            ctx.fillStyle = ef.color;
            ctx.fillText(ef.text, Math.round(ef.x), Math.round(ef.y));
          }
        });
      },

      renderCombatHUD(w, h) {
        // Ritratti ai lati delle barre vita
        drawPortraitImage(ctx, this.p1.id, 12, 10, 42, 42, false);
        ctx.strokeStyle = '#ffd541';
        ctx.lineWidth = 2;
        ctx.strokeRect(12, 10, 42, 42);

        drawPortraitImage(ctx, this.p2.id, w - 54, 10, 42, 42, true);
        ctx.strokeStyle = '#5ce1e6';
        ctx.strokeRect(w - 54, 10, 42, 42);

        // Barre vita stile Street Fighter II
        const barW = 224;
        const barH = 18;
        const p1BarX = 60;
        const p2BarX = w - 60 - barW;
        const barY = 16;

        // Sfondo rosso danno
        ctx.fillStyle = '#7a0010';
        ctx.fillRect(p1BarX, barY, barW, barH);
        ctx.fillRect(p2BarX, barY, barW, barH);

        // Barra danno ritardata (bianca/arancio)
        ctx.fillStyle = '#ff7b00';
        const p1DispW = Math.max(0, (this.p1.displayHp / 100) * barW);
        const p2DispW = Math.max(0, (this.p2.displayHp / 100) * barW);
        ctx.fillRect(p1BarX + (barW - p1DispW), barY, p1DispW, barH);
        ctx.fillRect(p2BarX, barY, p2DispW, barH);

        // Vita attuale (giallo oro brillante)
        ctx.fillStyle = this.p1.hp < 25 ? '#ff2a3c' : '#ffe600';
        const p1W = Math.max(0, (this.p1.hp / 100) * barW);
        ctx.fillRect(p1BarX + (barW - p1W), barY, p1W, barH);

        ctx.fillStyle = this.p2.hp < 25 ? '#ff2a3c' : '#ffe600';
        const p2W = Math.max(0, (this.p2.hp / 100) * barW);
        ctx.fillRect(p2BarX, barY, p2W, barH);

        // Bordi barre vita
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(p1BarX, barY, barW, barH);
        ctx.strokeRect(p2BarX, barY, barW, barH);

        // KO centrale + Timer 99s
        ctx.fillStyle = '#11162b';
        ctx.fillRect(w / 2 - 28, 10, 56, 38);
        ctx.strokeStyle = '#ffd541';
        ctx.strokeRect(w / 2 - 28, 10, 56, 38);

        ctx.textAlign = 'center';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = '#ff5964';
        ctx.fillText('K.O.', w / 2, 22);

        ctx.font = '15px "Press Start 2P", monospace';
        ctx.fillStyle = this.roundTimer <= 10 ? '#ff3b4e' : '#ffffff';
        ctx.fillText(String(this.roundTimer).padStart(2, '0'), w / 2, 43);

        // Nomi & Pallini Round vinti
        ctx.font = '9px "Press Start 2P", monospace';
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(this.p1.data.name, p1BarX, 48);

        for (let r = 0; r < 2; r++) {
          ctx.fillStyle = r < this.p1.roundsWon ? '#ffd541' : '#333a56';
          ctx.beginPath();
          ctx.arc(p1BarX + 82 + r * 14, 44, 5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(this.p2.data.name, p2BarX + barW, 48);

        for (let r = 0; r < 2; r++) {
          ctx.fillStyle = r < this.p2.roundsWon ? '#ffd541' : '#333a56';
          ctx.beginPath();
          ctx.arc(p2BarX + barW - 82 - r * 14, 44, 5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Barra ricarica Mossa Segreta
        this.renderSpecialMeter(p1BarX, 55, 118, this.p1);
        this.renderSpecialMeter(p2BarX + barW - 118, 55, 118, this.p2);

        // Contatore Combo
        if (this.p1.comboCount >= 2) {
          ctx.textAlign = 'left';
          ctx.font = '11px "Press Start 2P", monospace';
          ctx.fillStyle = '#ffd541';
          ctx.fillText(`${this.p1.comboCount} HIT COMBO!`, 18, 92);
        }
        if (this.p2.comboCount >= 2) {
          ctx.textAlign = 'right';
          ctx.font = '11px "Press Start 2P", monospace';
          ctx.fillStyle = '#5ce1e6';
          ctx.fillText(`${this.p2.comboCount} HIT COMBO!`, w - 18, 92);
        }
      },

      renderSpecialMeter(x, y, width, fighter) {
        const ready = fighter.specialCooldown === 0;
        const pct = ready ? 1 : 1 - fighter.specialCooldown / 85;
        ctx.fillStyle = '#151b33';
        ctx.fillRect(x, y, width, 8);
        ctx.fillStyle = ready ? '#ff3b5c' : '#3a86ff';
        ctx.fillRect(x, y, Math.round(width * pct), 8);
        ctx.strokeStyle = ready ? '#ffd541' : '#4a5580';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, width, 8);

        ctx.font = '6px "Press Start 2P", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = ready ? '#fff3b0' : '#8fa2d6';
        ctx.fillText(ready ? 'SPECIALE PRONTA!' : 'RICARICA...', x + width / 2, y + 7);
      },

      renderBanner(w, h) {
        ctx.textAlign = 'center';
        ctx.font = '26px "Press Start 2P", monospace';
        ctx.fillStyle = '#000';
        ctx.fillText(this.bannerText, w / 2 + 3, h / 2 - 6 + 3);
        ctx.fillStyle = '#ffd541';
        ctx.fillText(this.bannerText, w / 2, h / 2 - 6);

        if (this.bannerSub) {
          ctx.font = '11px "Press Start 2P", monospace';
          ctx.fillStyle = '#000';
          ctx.fillText(this.bannerSub, w / 2 + 2, h / 2 + 22 + 2);
          ctx.fillStyle = '#ffffff';
          ctx.fillText(this.bannerSub, w / 2, h / 2 + 22);
        }
      },

      renderVictoryScreen(w, h) {
        ctx.fillStyle = 'rgba(8, 11, 24, 0.85)';
        ctx.fillRect(36, 44, w - 72, h - 88);
        ctx.strokeStyle = '#ffd541';
        ctx.lineWidth = 3;
        ctx.strokeRect(36, 44, w - 72, h - 88);

        const winner = this.p1.roundsWon >= this.p2.roundsWon ? this.p1 : this.p2;

        drawPortraitImage(ctx, winner.id, w / 2 - 48, 78, 96, 96, false);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(w / 2 - 48, 78, 96, 96);

        ctx.textAlign = 'center';
        ctx.font = '16px "Press Start 2P", monospace';
        ctx.fillStyle = '#ffd541';
        ctx.fillText(`${winner.data.name} VINCE L'INCONTRO!`, w / 2, 68);

        // Frase di vittoria
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = '#8ef9f3';
        const words = winner.data.quote.split(' ');
        let line = '';
        let ly = 198;
        words.forEach((word) => {
          const test = line + word + ' ';
          if (test.length > 42) {
            ctx.fillText(line.trim(), w / 2, ly);
            line = word + ' ';
            ly += 15;
          } else {
            line = test;
          }
        });
        if (line) ctx.fillText(line.trim(), w / 2, ly);

        // Pulsante REMATCH
        ctx.fillStyle = '#ff5964';
        ctx.fillRect(w / 2 - 110, 250, 220, 32);
        ctx.strokeStyle = '#ffd541';
        ctx.lineWidth = 2;
        ctx.strokeRect(w / 2 - 110, 250, 220, 32);

        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('▶ REMATCH ◀', w / 2, 271);
      }
    };

    // =========================================================================
    // 8. PULSANTI UTILITY TOP BAR, CLICK SU CANVAS & GAME LOOP
    // =========================================================================
    document.getElementById('btn-home').addEventListener('click', () => {
      audio.sfxSelect();
      audio.stopBgm();
      game.state = 'TITLE';
    });

    const btnCrt = document.getElementById('btn-crt');
    const crtOverlay = document.getElementById('crt-overlay');
    btnCrt.addEventListener('click', () => {
      const hidden = crtOverlay.classList.toggle('hidden');
      btnCrt.textContent = hidden ? 'CRT: OFF' : 'CRT: ON';
      btnCrt.classList.toggle('active-off', hidden);
    });

    const btnSound = document.getElementById('btn-sound');
    btnSound.addEventListener('click', () => {
      const on = audio.toggle();
      btnSound.textContent = on ? 'AUDIO: ON' : 'AUDIO: OFF';
      btnSound.classList.toggle('active-off', !on);
    });

    const btnPadToggle = document.getElementById('btn-pad-toggle');
    const touchControlsEl = document.getElementById('touch-controls');
    const desktopLegendEl = document.getElementById('desktop-legend');
    btnPadToggle.addEventListener('click', () => {
      const isVisible = getComputedStyle(touchControlsEl).display !== 'none';
      if (isVisible) {
        touchControlsEl.style.display = 'none';
        desktopLegendEl.style.display = 'block';
      } else {
        touchControlsEl.style.display = 'flex';
        desktopLegendEl.style.display = 'none';
      }
    });

    // Interazione diretta con mouse/touch sul canvas nella schermata titolo/vittoria
    canvas.addEventListener('click', (e) => {
      audio.init();
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const cx = (e.clientX - rect.left) * scaleX;
      const cy = (e.clientY - rect.top) * scaleY;

      if (game.state === 'TITLE') {
        // Click sulla card di Pigna
        if (cx >= 24 && cx <= 270 && cy >= 70 && cy <= 274) {
          if (game.selectCursor !== 0) {
            game.selectCursor = 0;
            game.p1Choice = 'PIGNA';
            audio.sfxSelect();
            return;
          }
        }
        // Click sulla card di Lego
        if (cx >= 370 && cx <= 616 && cy >= 70 && cy <= 274) {
          if (game.selectCursor !== 1) {
            game.selectCursor = 1;
            game.p1Choice = 'LEGO';
            audio.sfxSelect();
            return;
          }
        }
        // Click sul selettore modalità 1P / 2P
        if (cy >= 284 && cy <= 320 && cx >= 24 && cx <= 390) {
          game.modeCursor = cx < 225 ? 0 : 1;
          game.mode = game.modeCursor === 0 ? '1P' : '2P';
          audio.sfxSelect();
          return;
        }

        // Avvia l'incontro!
        game.p2Choice = game.p1Choice === 'PIGNA' ? 'LEGO' : 'PIGNA';
        audio.sfxCoin();
        game.startMatch();
      } else if (game.state === 'MATCH_OVER' && game.stateTimer > 45) {
        audio.sfxSelect();
        game.state = 'TITLE';
      }
    });

    function gameLoop() {
      game.update();
      game.render();
      requestAnimationFrame(gameLoop);
    }

    window.onload = function () {
      gameLoop();
    };
  </script>
</body>
</html>
