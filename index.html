<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Street Vatte II - Champion Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a14; color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    #game-wrap {
      position: relative; width: 100vw; height: 100vh;
      max-width: 1100px; max-height: 700px;
      border: 4px solid #f7c600; background: #141829;
      display: flex; flex-direction: column;
    }
    canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    #overlay {
      position: absolute; inset: 0; background: rgba(10, 12, 26, 0.92);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 14px; z-index: 10;
    }
    h1 {
      font-size: clamp(20px, 4vw, 38px); color: #ffcf00;
      text-shadow: 3px 3px 0 #b80000, -1px -1px 0 #000;
      text-align: center; letter-spacing: 2px;
    }
    .sub { color: #5ce1e6; font-size: clamp(12px, 2vw, 16px); font-weight: bold; }
    .roster {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      width: 100%; max-width: 900px;
    }
    .card {
      background: #1d2440; border: 3px solid #4e5d94; border-radius: 6px;
      padding: 8px 4px; text-align: center; cursor: pointer; transition: transform 0.1s;
    }
    .card.active { border-color: #ffcf00; background: #2c3563; transform: scale(1.04); }
    .card .name { font-weight: bold; font-size: clamp(12px, 2vw, 17px); color: #fff; margin-top: 4px; }
    .card .move { font-size: clamp(9px, 1.4vw, 12px); color: #ffcf00; margin-top: 3px; }
    .controls-bar {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    }
    button.btn {
      background: #e62e00; color: #fff; border: 3px solid #ffcf00;
      padding: 10px 20px; font-size: clamp(14px, 2.4vw, 20px); font-weight: bold;
      font-family: inherit; cursor: pointer; border-radius: 6px;
      text-shadow: 2px 2px 0 #000;
    }
    button.btn.secondary { background: #1f4e8c; font-size: clamp(12px, 2vw, 16px); padding: 8px 14px; }
    button.btn:active { transform: scale(0.96); }
    #touch-ui {
      position: absolute; bottom: 8px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; pointer-events: none; z-index: 5;
    }
    .pad { display: flex; gap: 8px; pointer-events: auto; }
    .tbtn {
      width: 54px; height: 54px; border-radius: 50%;
      background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.55);
      color: #fff; font-weight: bold; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .tbtn.spec { background: rgba(255, 196, 0, 0.38); border-color: #ffcf00; color: #ffcf00; width: 64px; }
  </style>
</head>
<body>
<div id="game-wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="overlay">
    <div style="text-align:center;">
      <h1>STREET VATTE II</h1>
      <div class="sub">CHAMPION EDITION - RUGBY ARENA</div>
    </div>

    <div class="roster" id="roster"></div>

    <div id="preview-info" style="text-align:center; font-size:14px; color:#ddd;"></div>

    <div class="controls-bar">
      <button class="btn secondary" id="mode-btn">MODALITÀ: 1P VS CPU</button>
      <button class="btn" id="start-btn">INIZIA INCONTRO!</button>
    </div>
    <div style="font-size:11px; color:#aaa; text-align:center;">
      Tastiera: A/D Muovi • W Salta • F Pugno • G Calcio • H Mossa Segreta | Smartphone: Tasti su schermo
    </div>
  </div>

  <div id="touch-ui" style="display:none;">
    <div class="pad">
      <div class="tbtn" data-k="left">◀</div>
      <div class="tbtn" data-k="right">▶</div>
      <div class="tbtn" data-k="up">▲</div>
    </div>
    <div class="pad">
      <div class="tbtn" data-k="punch">P</div>
      <div class="tbtn" data-k="kick">K</div>
      <div class="tbtn spec" data-k="spec">SPEC</div>
    </div>
  </div>
</div>

<script>
const FIGHTERS = [
  {
    id: 'pigna', name: 'PIGNA', move: 'BULBO VOLANTE!', shout: 'OCCHIO!!',
    skin: '#e0a986', hair: '#2c5e3b', shirt: '#222222', pants: '#3a4b5c',
    hasBeanie: true, mustache: true, bigEye: true, w: 72, h: 150, speed: 4.3, hp: 100
  },
  {
    id: 'lego', name: 'LEGO', move: 'MANO-RAZZO LEGO!', shout: 'MANI LEGO!!',
    skin: '#e3ad88', hair: '#5a3821', shirt: '#d9ff00', pants: '#232833',
    legoHands: true, w: 72, h: 150, speed: 4.5, hp: 100
  },
  {
    id: 'vatte', name: 'VATTE', move: 'OPOSSUM!', shout: 'OPOSSUM!!',
    skin: '#dca17e', hair: '#3b3330', shirt: '#dca17e', pants: '#1f2c59',
    sumo: true, glasses: true, pinkNails: true, w: 96, h: 155, speed: 3.6, hp: 120
  },
  {
    id: 'taglia', name: 'TAGLIA', move: 'PEZZO DI MERDA!', shout: 'PEZZO DI MERDA!!',
    skin: '#e2ab87', hair: '#4a3222', shirt: '#1a5fb4', pants: '#ffffff',
    muscular: true, w: 80, h: 155, speed: 4.2, hp: 105
  },
  {
    id: 'kianu', name: 'KIANU', move: 'PUFFO ELETTRICO!', shout: 'PUFFO THUNDER!!',
    skin: '#d99e79', hair: '#76e038', shirt: '#ffd500', pants: '#1e5631',
    hood: true, smurf: true, w: 76, h: 150, speed: 4.7, hp: 100
  }
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const touchUI = document.getElementById('touch-ui');
const rosterEl = document.getElementById('roster');
const previewEl = document.getElementById('preview-info');

let selectedIdx = 2; // Vatte default
let vsCPU = true;
let gameState = 'menu';
let timer = 99;
let lastSec = 0;
let projectiles = [];
let shoutBanner = { text: '', timer: 0, x: 480, y: 200 };
let shake = 0;

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (gameState === 'fight') {
    if (e.code === 'KeyF') doAttack(p1, 'punch');
    if (e.code === 'KeyG') doAttack(p1, 'kick');
    if (e.code === 'KeyH') doSpecial(p1);
    if (!vsCPU) {
      if (e.code === 'KeyJ') doAttack(p2, 'punch');
      if (e.code === 'KeyK') doAttack(p2, 'kick');
      if (e.code === 'KeyL') doSpecial(p2);
    }
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

document.querySelectorAll('.tbtn').forEach(btn => {
  const k = btn.dataset.k;
  const press = (e) => {
    e.preventDefault();
    if (k === 'left') keys['TouchLeft'] = true;
    if (k === 'right') keys['TouchRight'] = true;
    if (k === 'up') keys['TouchUp'] = true;
    if (k === 'punch' && gameState === 'fight') doAttack(p1, 'punch');
    if (k === 'kick' && gameState === 'fight') doAttack(p1, 'kick');
    if (k === 'spec' && gameState === 'fight') doSpecial(p1);
  };
  const release = (e) => {
    e.preventDefault();
    if (k === 'left') keys['TouchLeft'] = false;
    if (k === 'right') keys['TouchRight'] = false;
    if (k === 'up') keys['TouchUp'] = false;
  };
  btn.addEventListener('touchstart', press, { passive: false });
  btn.addEventListener('touchend', release, { passive: false });
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
});

function renderRoster() {
  rosterEl.innerHTML = '';
  FIGHTERS.forEach((f, idx) => {
    const div = document.createElement('div');
    div.className = 'card' + (idx === selectedIdx ? ' active' : '');
    div.innerHTML = `
      <canvas width="70" height="70" id="port-${idx}" style="width:64px;height:64px;border:2px solid #000;background:#101528;"></canvas>
      <div class="name">${f.name}</div>
      <div class="move">${f.move}</div>
    `;
    div.onclick = () => { selectedIdx = idx; renderRoster(); };
    rosterEl.appendChild(div);
    drawPortrait(document.getElementById(`port-${idx}`).getContext('2d'), f);
  });
  const sel = FIGHTERS[selectedIdx];
  previewEl.innerHTML = `SELEZIONATO: <b style="color:#ffcf00">${sel.name}</b> — MOSSA SEGRETA: <b style="color:#5ce1e6">${sel.move}</b>`;
}

function drawPortrait(c, f) {
  c.clearRect(0, 0, 70, 70);
  c.fillStyle = '#18244a'; c.fillRect(0, 0, 70, 70);
  // Spalle
  c.fillStyle = f.shirt; c.fillRect(10, 48, 50, 22);
  // Testa
  c.fillStyle = f.skin; c.fillRect(20, 16, 30, 32);
  if (f.hasBeanie) {
    c.fillStyle = '#255c36'; c.fillRect(18, 8, 34, 14);
  } else if (f.hood) {
    c.fillStyle = '#76e038'; c.fillRect(16, 10, 38, 38);
    c.fillStyle = f.skin; c.fillRect(22, 18, 26, 26);
  } else {
    c.fillStyle = f.hair; c.fillRect(20, 11, 30, 8);
  }
  // Occhi / Occhiali
  if (f.glasses) {
    c.fillStyle = '#111'; c.fillRect(21, 24, 12, 8); c.fillRect(37, 24, 12, 8);
    c.strokeStyle = '#c47d3b'; c.lineWidth = 2; c.strokeRect(21, 24, 12, 8); c.strokeRect(37, 24, 12, 8);
  } else {
    c.fillStyle = '#fff'; c.fillRect(24, 24, 6, 6); c.fillRect(39, 23, f.bigEye ? 10 : 6, f.bigEye ? 10 : 6);
    c.fillStyle = '#000'; c.fillRect(26, 26, 3, 3); c.fillRect(42, 26, f.bigEye ? 5 : 3, f.bigEye ? 5 : 3);
  }
  if (f.mustache) {
    c.fillStyle = '#222'; c.fillRect(25, 36, 20, 5); c.fillRect(30, 42, 10, 4);
  }
  if (f.legoHands) {
    c.fillStyle = '#ffd500'; c.fillRect(6, 44, 12, 12); c.fillRect(52, 44, 12, 12);
  }
}

document.getElementById('mode-btn').onclick = (e) => {
  vsCPU = !vsCPU;
  e.target.textContent = vsCPU ? 'MODALITÀ: 1P VS CPU' : 'MODALITÀ: 2P LOCALE';
};

let p1, p2;
function makePlayer(f, x, dir) {
  return {
    ...f, x, y: 455, vx: 0, vy: 0, dir,
    curHp: f.hp, maxHp: f.hp,
    state: 'idle', stateTimer: 0, attackType: '', hitDone: false,
    smurfActive: 0, opossumPhase: 0
  };
}

document.getElementById('start-btn').onclick = () => {
  const f1 = FIGHTERS[selectedIdx];
  const oppIdx = (selectedIdx + 1) % FIGHTERS.length;
  const f2 = FIGHTERS[oppIdx];
  p1 = makePlayer(f1, 220, 1);
  p2 = makePlayer(f2, 740, -1);
  projectiles = [];
  timer = 99;
  lastSec = performance.now();
  gameState = 'fight';
  overlay.style.display = 'none';
  touchUI.style.display = 'flex';
  triggerShout('ROUND 1 - FIGHT!', 480, 210, 60);
};

function triggerShout(text, x, y, dur = 55) {
  shoutBanner = { text, x, y, timer: dur };
}

function doAttack(p, type) {
  if (p.state !== 'idle' && p.state !== 'walk') return;
  p.state = 'attack';
  p.attackType = type;
  p.stateTimer = type === 'punch' ? 14 : 20;
  p.hitDone = false;
}

function doSpecial(p) {
  if (p.state !== 'idle' && p.state !== 'walk') return;
  triggerShout(p.shout, p.x, p.y - 175, 65);
  if (p.id === 'vatte') {
    p.state = 'opossum_playdead';
    p.stateTimer = 28;
    p.hitDone = false;
    return;
  }
  if (p.id === 'kianu') {
    p.state = 'special';
    p.stateTimer = 28;
    p.smurfActive = 65;
    projectiles.push({
      owner: p, type: 'lightning', x: p.x + p.dir * 55, y: p.y - 85,
      vx: p.dir * 13, r: 28, dmg: 18
    });
    return;
  }
  p.state = 'special';
  p.stateTimer = 24;
  if (p.id === 'pigna') {
    projectiles.push({
      owner: p, type: 'eye', x: p.x + p.dir * 45, y: p.y - 120,
      vx: p.dir * 10, r: 22, dmg: 16
    });
  } else if (p.id === 'lego') {
    projectiles.push({
      owner: p, type: 'lego', x: p.x + p.dir * 45, y: p.y - 95,
      vx: p.dir * 11, r: 20, dmg: 16
    });
  } else if (p.id === 'taglia') {
    projectiles.push({
      owner: p, type: 'wave', x: p.x + p.dir * 55, y: p.y - 90,
      vx: p.dir * 11.5, r: 30, dmg: 18
    });
  }
}

function damagePlayer(target, dmg) {
  target.curHp = Math.max(0, target.curHp - dmg);
  target.state = 'hurt';
  target.stateTimer = 14;
  shake = 8;
  if (target.curHp <= 0) {
    gameState = 'ko';
    const winner = target === p1 ? p2 : p1;
    triggerShout(`K.O.! VINCE ${winner.name}!`, 480, 210, 180);
    setTimeout(() => {
      overlay.style.display = 'flex';
      touchUI.style.display = 'none';
      gameState = 'menu';
    }, 3200);
  }
}

function updatePlayer(p, opp, controls) {
  if (p.smurfActive > 0) p.smurfActive--;

  if (p.state === 'opossum_playdead') {
    p.stateTimer--;
    if (p.stateTimer <= 0) {
      p.state = 'opossum_dash';
      p.stateTimer = 28;
      p.vx = p.dir * 18;
    }
    return;
  }

  if (p.state === 'opossum_dash') {
    p.x += p.vx;
    p.stateTimer--;
    if (!p.hitDone && Math.abs(p.x - opp.x) < 85 && Math.abs(p.y - opp.y) < 90) {
      p.hitDone = true;
      damagePlayer(opp, 20);
    }
    if (p.stateTimer <= 0 || p.x < 60 || p.x > 900) {
      p.vx = 0;
      p.state = 'idle';
    }
    p.x = Math.max(60, Math.min(900, p.x));
    return;
  }

  if (p.stateTimer > 0) {
    p.stateTimer--;
    if (p.state === 'attack' && !p.hitDone && p.stateTimer === 7) {
      const reach = p.attackType === 'kick' ? 115 : 95;
      if (Math.abs((p.x + p.dir * 45) - opp.x) < reach && Math.abs(p.y - opp.y) < 95) {
        p.hitDone = true;
        damagePlayer(opp, p.attackType === 'kick' ? 10 : 7);
      }
    }
    if (p.stateTimer <= 0) p.state = 'idle';
  } else {
    p.dir = opp.x >= p.x ? 1 : -1;
    p.vx = 0;
    if (controls.left) { p.vx = -p.speed; if (p.y >= 455) p.state = 'walk'; }
    else if (controls.right) { p.vx = p.speed; if (p.y >= 455) p.state = 'walk'; }
    else if (p.y >= 455) { p.state = 'idle'; }

    if (controls.up && p.y >= 455) {
      p.vy = -15.5;
    }
  }

  p.x += p.vx;
  p.y += p.vy;
  if (p.y < 455) {
    p.vy += 0.85;
  } else {
    p.y = 455;
    p.vy = 0;
  }
  p.x = Math.max(60, Math.min(900, p.x));
}

function updateCPU() {
  const dist = p1.x - p2.x;
  const ctrl = { left: false, right: false, up: false };
  if (Math.abs(dist) > 120) {
    if (dist > 0) ctrl.right = true; else ctrl.left = true;
  } else if (Math.random() < 0.04) {
    doAttack(p2, Math.random() < 0.5 ? 'punch' : 'kick');
  }
  if (Math.random() < 0.014) doSpecial(p2);
  if (Math.random() < 0.01) ctrl.up = true;
  updatePlayer(p2, p1, ctrl);
}

function drawStage() {
  // Cielo tramonto
  const grad = ctx.createLinearGradient(0, 0, 0, 340);
  grad.addColorStop(0, '#1c2559');
  grad.addColorStop(0.55, '#c94b4b');
  grad.addColorStop(1, '#f7b733');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 960, 340);

  // Colline
  ctx.fillStyle = '#243b35';
  ctx.beginPath(); ctx.moveTo(0, 320); ctx.lineTo(220, 230); ctx.lineTo(480, 310); ctx.lineTo(760, 220); ctx.lineTo(960, 300); ctx.lineTo(960, 340); ctx.lineTo(0, 340); ctx.fill();

  // Tribuna + Club House
  ctx.fillStyle = '#3c2a21'; ctx.fillRect(80, 250, 320, 80);
  ctx.fillStyle = '#8b261d'; ctx.fillRect(70, 235, 340, 18);
  ctx.fillStyle = '#ffcf00'; ctx.font = 'bold 14px monospace'; ctx.fillText('RUGBY CLUB BIELLA', 165, 248);

  // Pali Rugby ad H
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(720, 120, 8, 210);
  ctx.fillRect(820, 120, 8, 210);
  ctx.fillRect(720, 220, 108, 7);
  ctx.fillStyle = '#0055cc';
  ctx.fillRect(716, 285, 16, 45);
  ctx.fillRect(816, 285, 16, 45);

  // Prato Rugby
  ctx.fillStyle = '#2d7a32';
  ctx.fillRect(0, 330, 960, 210);
  ctx.fillStyle = '#368f3c';
  for (let i = 0; i < 960; i += 120) ctx.fillRect(i, 330, 60, 210);

  // Linee bianche campo
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, 345); ctx.lineTo(960, 345);
  ctx.moveTo(0, 480); ctx.lineTo(960, 480);
  ctx.moveTo(480, 345); ctx.lineTo(480, 480);
  ctx.stroke();
}

function drawFighter(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  // Ombra a terra
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(0, 4, p.w * 0.55, 12, 0, 0, Math.PI * 2); ctx.fill();

  if (p.state === 'opossum_playdead') {
    ctx.rotate(Math.PI / 2 * p.dir);
    ctx.translate(-35, 0);
  } else if (p.state === 'opossum_dash') {
    ctx.rotate(Math.PI / 2 * p.dir);
    ctx.translate(-55, 0);
  }

  ctx.scale(p.dir, 1);
  const bob = (p.state === 'idle' || p.state === 'walk') ? Math.sin(performance.now() * 0.01) * 3 : 0;
  const skinCol = p.smurfActive > 0 ? '#1e90ff' : p.skin;

  // Aura fulmini per Kianu Puffo
  if (p.smurfActive > 0) {
    ctx.strokeStyle = '#7df9ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(-p.w / 2 - 8, -p.h - 8, p.w + 16, p.h + 12);
  }

  // Gambe
  ctx.fillStyle = p.pants;
  ctx.fillRect(-p.w * 0.34, -58, 22, 58);
  ctx.fillRect(p.w * 0.08, -58, 22, 58);
  // Scarpe
  ctx.fillStyle = '#111';
  ctx.fillRect(-p.w * 0.36, -10, 28, 10);
  ctx.fillRect(p.w * 0.08, -10, 28, 10);

  // Busto
  ctx.fillStyle = p.sumo ? skinCol : p.shirt;
  ctx.fillRect(-p.w * 0.44, -118 + bob, p.w * 0.88, 64);
  if (p.sumo) {
    ctx.fillStyle = '#1f2c59';
    ctx.fillRect(-p.w * 0.45, -72 + bob, p.w * 0.9, 18);
  }
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.strokeRect(-p.w * 0.44, -118 + bob, p.w * 0.88, 64);

  // Braccia + Attacco
  const ext = p.state === 'attack' ? 42 : 0;
  ctx.fillStyle = skinCol;
  ctx.fillRect(10, -108 + bob, 32 + ext, 18);
  if (p.legoHands) {
    ctx.fillStyle = '#ffd500';
    ctx.fillRect(38 + ext, -112 + bob, 18, 22);
  } else if (p.pinkNails) {
    ctx.fillStyle = '#ff69b4';
    ctx.fillRect(40 + ext, -106 + bob, 12, 8);
  }

  // Testa
  ctx.fillStyle = skinCol;
  ctx.fillRect(-20, -156 + bob, 40, 38);
  ctx.strokeRect(-20, -156 + bob, 40, 38);

  if (p.hasBeanie) {
    ctx.fillStyle = '#255c36'; ctx.fillRect(-22, -166 + bob, 44, 16);
  } else if (p.hood) {
    ctx.fillStyle = '#76e038'; ctx.fillRect(-24, -162 + bob, 48, 44);
    ctx.fillStyle = skinCol; ctx.fillRect(-14, -150 + bob, 30, 28);
  } else {
    ctx.fillStyle = p.hair; ctx.fillRect(-20, -162 + bob, 40, 10);
  }

  // Occhi / Occhiali / Baffi
  if (p.glasses) {
    ctx.fillStyle = '#111'; ctx.fillRect(2, -145 + bob, 16, 10);
  } else {
    ctx.fillStyle = '#fff';
    ctx.fillRect(4, -146 + bob, p.bigEye ? 13 : 8, p.bigEye ? 13 : 8);
    ctx.fillStyle = '#000';
    ctx.fillRect(8, -143 + bob, p.bigEye ? 6 : 4, p.bigEye ? 6 : 4);
  }
  if (p.mustache) {
    ctx.fillStyle = '#222'; ctx.fillRect(2, -130 + bob, 16, 6);
  }

  ctx.restore();

  if (p.state === 'opossum_playdead') {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.fillText('Zzz...', p.x - 20, p.y - 50);
  }
}

function drawProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    pr.x += pr.vx;
    const opp = pr.owner === p1 ? p2 : p1;

    ctx.save();
    ctx.translate(pr.x, pr.y);
    if (pr.type === 'eye') {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#d00'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#4a2e16'; ctx.beginPath(); ctx.arc(5, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(6, 0, 4, 0, Math.PI * 2); ctx.fill();
    } else if (pr.type === 'lego') {
      ctx.fillStyle = '#ffd500';
      ctx.fillRect(-18, -14, 34, 28);
      ctx.clearRect(4, -7, 14, 14);
      ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.strokeRect(-18, -14, 34, 28);
    } else if (pr.type === 'wave') {
      ctx.fillStyle = '#00e5ff'; ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(4, 0, 16, 0, Math.PI * 2); ctx.fill();
    } else if (pr.type === 'lightning') {
      ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(-25, -15); ctx.lineTo(0, 10); ctx.lineTo(-5, -8); ctx.lineTo(25, 15); ctx.stroke();
    }
    ctx.restore();

    if (Math.abs(pr.x - opp.x) < 55 && Math.abs(pr.y - (opp.y - 75)) < 75) {
      damagePlayer(opp, pr.dmg);
      projectiles.splice(i, 1);
      continue;
    }
    if (pr.x < -50 || pr.x > 1010) projectiles.splice(i, 1);
  }
}

function drawHUD() {
  // Barre vita stile SF2
  ctx.fillStyle = '#222';
  ctx.fillRect(40, 24, 380, 26);
  ctx.fillRect(540, 24, 380, 26);

  const w1 = (p1.curHp / p1.maxHp) * 372;
  const w2 = (p2.curHp / p2.maxHp) * 372;

  ctx.fillStyle = p1.curHp > 30 ? '#ffcf00' : '#ff2a00';
  ctx.fillRect(44 + (372 - w1), 28, w1, 18);

  ctx.fillStyle = p2.curHp > 30 ? '#ffcf00' : '#ff2a00';
  ctx.fillRect(544, 28, w2, 18);

  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
  ctx.strokeRect(40, 24, 380, 26);
  ctx.strokeRect(540, 24, 380, 26);

  // KO centrale
  ctx.fillStyle = '#b80000'; ctx.fillRect(452, 20, 56, 34);
  ctx.strokeStyle = '#ffcf00'; ctx.strokeRect(452, 20, 56, 34);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace'; ctx.fillText('K.O.', 458, 43);

  // Nomi & Timer
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px monospace';
  ctx.fillText(p1.name, 42, 72);
  ctx.fillText(p2.name, 918 - ctx.measureText(p2.name).width, 72);

  ctx.fillStyle = '#ffcf00'; ctx.font = 'bold 30px monospace';
  const tStr = String(timer).padStart(2, '0');
  ctx.fillText(tStr, 480 - ctx.measureText(tStr).width / 2, 82);

  if (shoutBanner.timer > 0) {
    shoutBanner.timer--;
    ctx.save();
    ctx.font = 'bold 34px monospace';
    const tw = ctx.measureText(shoutBanner.text).width;
    const bx = Math.max(20, Math.min(940 - tw, shoutBanner.x - tw / 2));
    ctx.fillStyle = '#000';
    ctx.fillText(shoutBanner.text, bx + 3, shoutBanner.y + 3);
    ctx.fillStyle = '#ffcf00';
    ctx.fillText(shoutBanner.text, bx, shoutBanner.y);
    ctx.restore();
  }
}

function loop(now) {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake--;
  }

  drawStage();

  if (gameState === 'fight' || gameState === 'ko') {
    if (gameState === 'fight') {
      if (now - lastSec >= 1000) {
        lastSec = now;
        if (timer > 0) timer--;
      }
      updatePlayer(p1, p2, {
        left: keys['KeyA'] || keys['ArrowLeft'] || keys['TouchLeft'],
        right: keys['KeyD'] || keys['ArrowRight'] || keys['TouchRight'],
        up: keys['KeyW'] || keys['ArrowUp'] || keys['TouchUp']
      });
      if (vsCPU) {
        updateCPU();
      } else {
        updatePlayer(p2, p1, {
          left: keys['ArrowLeft'], right: keys['ArrowRight'], up: keys['ArrowUp']
        });
      }
    }
    drawFighter(p1);
    drawFighter(p2);
    drawProjectiles();
    drawHUD();
  }

  ctx.restore();
  requestAnimationFrame(loop);
}

renderRoster();
requestAnimationFrame(loop);
</script>
