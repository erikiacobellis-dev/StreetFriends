<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STREET FRIENDS II: Pigna vs Lego</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #09090e;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #arcade-cabinet {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 1120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      background: radial-gradient(circle at center, #181828 0%, #07070c 100%);
    }

    /* Top utility bar */
    #top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      z-index: 20;
      gap: 6px;
      flex-wrap: wrap;
    }

    .arcade-pill {
      background: #1b1b2e;
      border: 2px solid #ffd541;
      color: #ffd541;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 3px 0 #8a5a00;
      transition: transform 0.08s;
    }

    .arcade-pill:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #8a5a00;
    }

    .arcade-pill.active-off {
      border-color: #666;
      color: #888;
      box-shadow: 0 3px 0 #333;
    }

    /* Screen wrapper */
    #screen-frame {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #2b2b42;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    canvas#gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* CRT Scanline Effect */
    #crt-overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%,
        rgba(0, 0, 0, 0.26) 50%
      ),
      linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.04),
        rgba(0, 255, 0, 0.02),
        rgba(0, 0, 255, 0.04)
      );
      background-size: 100% 4px, 6px 100%;
      z-index: 10;
      opacity: 0.72;
    }

    #crt-overlay.hidden {
      display: none;
    }

    /* Controls legend on desktop & mobile touch controls */
    #controls-area {
      width: 100%;
      padding: 6px 4px 2px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }

    #desktop-legend {
      text-align: center;
      font-size: 9px;
      color: #b8c2ff;
      line-height: 1.55;
      background: rgba(20, 22, 38, 0.85);
      border: 2px solid #2d3254;
      border-radius: 8px;
      padding: 6px 10px;
    }

    #desktop-legend span.hl {
      color: #ffd541;
    }

    #desktop-legend span.sp {
      color: #ff5964;
    }

    /* Touch Pad */
    #touch-controls {
      display: none;
      width: 100%;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      gap: 10px;
    }

    @media (pointer: coarse), (max-width: 820px) {
      #touch-controls {
        display: flex;
      }
      #desktop-legend {
        display: none;
      }
    }

    .dpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 42px);
      gap: 4px;
    }

    .pad-btn {
      background: linear-gradient(180deg, #3c4266 0%, #232740 100%);
      border: 2px solid #7580b8;
      border-radius: 8px;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #121424;
      cursor: pointer;
    }

    .pad-btn:active, .pad-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #121424;
      background: #586296;
    }

    .action-cluster {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arc-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: #fff;
      border: 3px solid rgba(255,255,255,0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      line-height: 1.25;
      cursor: pointer;
      text-shadow: 1px 1px 0 #000;
    }

    .arc-btn:active, .arc-btn.pressed {
      transform: translateY(4px) scale(0.96);
    }

    .btn-punch {
      background: radial-gradient(circle at 30% 30%, #4da6ff, #0059b3);
      box-shadow: 0 5px 0 #003366;
    }

    .btn-kick {
      background: radial-gradient(circle at 30% 30%, #ffd24d, #cc8800);
      box-shadow: 0 5px 0 #664400;
    }

    .btn-special {
      width: 66px;
      height: 66px;
      background: radial-gradient(circle at 30% 30%, #ff5e6c, #b3001b);
      box-shadow: 0 5px 0 #59000d;
      border-color: #ffe066;
    }
  </style>
</head>
<body>
  <div id="arcade-cabinet">
    <!-- Top Arcade Utility Bar -->
    <div id="top-bar">
      <div style="font-size: 10px; color: #ffcf40; text-shadow: 2px 2px 0 #990000;">
        STREET FRIENDS II
      </div>
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button id="btn-home" class="arcade-pill" title="Torna al menu">MENU</button>
        <button id="btn-crt" class="arcade-pill" title="Attiva/Disattiva linee CRT">CRT: ON</button>
        <button id="btn-sound" class="arcade-pill" title="Audio Chiptune">AUDIO: ON</button>
        <button id="btn-pad-toggle" class="arcade-pill" title="Mostra/Nascondi pad touch">PAD</button>
      </div>
    </div>

    <!-- Main 16-bit Arcade Screen -->
    <div id="screen-frame">
      <canvas id="gameCanvas" width="640" height="360"></canvas>
      <div id="crt-overlay"></div>
    </div>

    <!-- Controls Area -->
    <div id="controls-area">
      <div id="desktop-legend">
        <span class="hl">P1:</span> [W A S D] Muovi/Salta/Para &nbsp;|&nbsp;
        <span class="hl">[F]</span> Pugno &nbsp;
        <span class="hl">[G]</span> Calcio &nbsp;
        <span class="sp">[H] MOSSA SEGRETA</span>
        <br/>
        <span class="hl">P2 (2P):</span> [Frecce] Muovi/Salta/Para &nbsp;|&nbsp;
        <span class="hl">[K]</span> Pugno &nbsp;
        <span class="hl">[L]</span> Calcio &nbsp;
        <span class="sp">[J] MOSSA SEGRETA</span>
      </div>

      <!-- Mobile / Touch Arcade Controls -->
      <div id="touch-controls">
        <div class="dpad-grid">
          <div></div>
          <button class="pad-btn" data-key="up">▲</button>
          <div></div>
          <button class="pad-btn" data-key="left">◀</button>
          <button class="pad-btn" data-key="down">▼</button>
          <button class="pad-btn" data-key="right">▶</button>
          <div></div>
          <div></div>
          <div></div>
        </div>

        <div class="action-cluster">
          <button class="arc-btn btn-punch" data-key="punch">PUGNO</button>
          <button class="arc-btn btn-kick" data-key="kick">CALCIO</button>
          <button class="arc-btn btn-special" data-key="special">SPECIALE</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * STREET FRIENDS II: CHAMPION EDITION
     * Picchiaduro arcade anni '90 100% auto-contenuto con PIGNA e LEGO
     * Grafica pixel art procedurale ad alta somiglianza & Stadio Rugby Italiano
     */

    // =========================================================================
    // 1. MOTORE AUDIO CHIPTUNE 16-BIT (WEB AUDIO API)
    // =========================================================================
    class RetroAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.bgmTimer = null;
        this.bgmStep = 0;
        this.isPlayingBgm = false;
      }

      init() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              this.ctx = new AudioCtx();
            }
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
        } catch (e) {
          // Ignora restrizioni autoplay finché non arriva un input utente
        }
      }

      toggle() {
        this.enabled = !this.enabled;
        if (!this.enabled) {
          this.stopBgm();
        } else if (typeof game !== 'undefined' && game.state === 'FIGHT') {
          this.startBgm();
        }
        return this.enabled;
      }

      playTone(freq, duration, type = 'square', volume = 0.11, slideTo = null, delay = 0) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          if (slideTo) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + duration);
          }

          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + duration);
        } catch (e) {}
      }

      playNoise(duration, volume = 0.15) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        try {
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 920;

          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
        } catch (e) {}
      }

      sfxSelect() {
        this.playTone(523.25, 0.07, 'square', 0.11);
        this.playTone(783.99, 0.11, 'square', 0.11, null, 0.06);
      }

      sfxCoin() {
        this.playTone(987.77, 0.08, 'square', 0.14);
        this.playTone(1318.51, 0.28, 'square', 0.14, null, 0.08);
      }

      sfxWhiff() {
        this.playTone(260, 0.08, 'triangle', 0.09, 110);
      }

      sfxHitLight() {
        this.playNoise(0.09, 0.18);
        this.playTone(190, 0.09, 'sawtooth', 0.14, 65);
      }

      sfxHitHeavy() {
        this.playNoise(0.16, 0.25);
        this.playTone(140, 0.18, 'square', 0.19, 42);
      }

      sfxBlock() {
        this.playTone(440, 0.06, 'square', 0.12, 620);
      }

      sfxEyeballLaunch() {
        // Effetto "BOING-ZAP!" per l'occhio volante di Pigna
        this.playTone(185, 0.16, 'sine', 0.18, 690);
        this.playTone(690, 0.18, 'sawtooth', 0.14, 240, 0.12);
        this.playTone(880, 0.14, 'square', 0.1, 440, 0.22);
      }

      sfxLegoLaunch() {
        // Doppio "CLACK-CLACK!" plastico + razzo per le mani Lego
        this.playTone(960, 0.05, 'square', 0.16, 520);
        this.playTone(1160, 0.05, 'square', 0.16, 600, 0.07);
        this.playNoise(0.18, 0.14);
        this.playTone(320, 0.2, 'sawtooth', 0.13, 740, 0.1);
      }

      sfxRoundStart() {
        const notes = [392, 523.25, 659.25, 783.99];
        notes.forEach((n, idx) => {
          this.playTone(n, 0.12, 'square', 0.13, null, idx * 0.09);
        });
      }

      sfxKO() {
        this.playNoise(0.45, 0.28);
        this.playTone(220, 0.5, 'sawtooth', 0.22, 38);
        this.playTone(165, 0.55, 'square', 0.18, 30, 0.08);
      }

      sfxVictory() {
        const fanfare = [
          { f: 523.25, d: 0.12, t: 0 },
          { f: 659.25, d: 0.12, t: 0.13 },
          { f: 783.99, d: 0.12, t: 0.26 },
          { f: 1046.5, d: 0.35, t: 0.40 },
          { f: 783.99, d: 0.14, t: 0.78 },
          { f: 1046.5, d: 0.45, t: 0.94 }
        ];
        fanfare.forEach(n => this.playTone(n.f, n.d, 'square', 0.14, null, n.t));
      }

      startBgm() {
        if (!this.enabled || this.isPlayingBgm) return;
        this.init();
        this.isPlayingBgm = true;
        this.bgmStep = 0;

        const bassLine = [
          110, 110, 220, 110, 130.81, 130.81, 146.83, 164.81,
          110, 110, 220, 110, 164.81, 146.83, 130.81, 98.00
        ];
        const leadLine = [
          440, 0, 523.25, 659.25, 587.33, 0, 523.25, 493.88,
          440, 523.25, 659.25, 783.99, 659.25, 587.33, 523.25, 0
        ];

        this.bgmTimer = setInterval(() => {
          if (!this.enabled || !this.isPlayingBgm) return;
          const idx = this.bgmStep % bassLine.length;
          this.playTone(bassLine[idx], 0.13, 'triangle', 0.065);
          if (leadLine[idx] > 0) {
            this.playTone(leadLine[idx], 0.11, 'square', 0.042);
          }
          this.bgmStep++;
        }, 165);
      }

      stopBgm() {
        this.isPlayingBgm = false;
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
      }
    }

    const audio = new RetroAudio();

    // =========================================================================
    // 2. GENERATORE PIXEL ART PROCEDURALE 16-BIT (ZERO DIPENDENZE ESTERNE!)
    // =========================================================================
    function createPixelCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      return { canvas: c, ctx };
    }

    function pxRect(ctx, x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function pxEllipse(ctx, cx, cy, rx, ry, color) {
      ctx.fillStyle = color;
      for (let dy = -ry; dy <= ry; dy++) {
        for (let dx = -rx; dx <= rx; dx++) {
          if ((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) <= 1.0) {
            ctx.fillRect(Math.round(cx + dx), Math.round(cy + dy), 1, 1);
          }
        }
      }
    }

    // Ritratto 16-bit ad altissima somiglianza (96x96 pixel) di PIGNA
    // Berretto verde scuro a coste, chiodo nero con borchie argentate, polo grigia,
    // baffoni scuri, pizzetto sale e pepe, sorriso fiero da picchiaduro e un occhio gigante!
    function buildPignaPortraitHiRes() {
      const { canvas, ctx } = createPixelCanvas(96, 96);

      // Sfondo ritratto arcade blu/viola stilizzato stile Street Fighter II
      pxRect(ctx, 0, 0, 96, 96, '#14193b');
      for (let y = 0; y < 96; y += 4) {
        pxRect(ctx, 0, y, 96, 2, y < 48 ? '#1d275c' : '#261c4a');
      }
      // Cornice interna sottile
      pxRect(ctx, 3, 3, 90, 90, '#0c0f24');
      pxRect(ctx, 5, 5, 86, 86, '#232d69');
      // Griglia neon sottile sullo sfondo
      for (let gx = 10; gx < 88; gx += 12) pxRect(ctx, gx, 5, 1, 86, '#303f8a');
      for (let gy = 10; gy < 88; gy += 12) pxRect(ctx, 5, gy, 86, 1, '#303f8a');

      // Spalle e chiodo in pelle nera con revers e borchie argentate
      pxEllipse(ctx, 48, 92, 42, 24, '#0c0d12');
      pxEllipse(ctx, 48, 92, 39, 21, '#1c1f29');
      // Collo e dolcevita nero interno
      pxRect(ctx, 36, 62, 24, 16, '#c7835c');
      pxRect(ctx, 38, 69, 20, 9, '#12141a');
      // Polo grigia colletto aperto
      pxRect(ctx, 34, 76, 28, 20, '#7d8594');
      pxRect(ctx, 32, 74, 10, 8, '#9aa3b2');
      pxRect(ctx, 54, 74, 10, 8, '#9aa3b2');
      pxRect(ctx, 47, 78, 3, 18, '#5a616e');

      // Revers del chiodo in pelle nera + riflessi + bottoni metallici
      // Lato sinistro
      for (let i = 0; i < 20; i++) {
        pxRect(ctx, 14 + Math.floor(i * 0.7), 70 + i, 18, 2, '#101217');
        pxRect(ctx, 16 + Math.floor(i * 0.7), 70 + i, 3, 2, '#3d4457');
      }
      pxRect(ctx, 14, 73, 4, 4, '#d9e2f2');
      pxRect(ctx, 15, 74, 2, 2, '#ffffff');
      pxRect(ctx, 25, 82, 4, 4, '#d9e2f2');

      // Lato destro
      for (let i = 0; i < 20; i++) {
        pxRect(ctx, 64 - Math.floor(i * 0.7), 70 + i, 18, 2, '#101217');
        pxRect(ctx, 77 - Math.floor(i * 0.7), 70 + i, 3, 2, '#3d4457');
      }
      pxRect(ctx, 78, 73, 4, 4, '#d9e2f2');
      pxRect(ctx, 79, 74, 2, 2, '#ffffff');
      pxRect(ctx, 67, 82, 4, 4, '#d9e2f2');

      // Viso (forma piena e simpatica, carnagione mediterranea calda)
      pxEllipse(ctx, 49, 46, 22, 24, '#8c4c2b'); // contorno ombra
      pxEllipse(ctx, 49, 45, 20, 22, '#e39b70'); // base pelle
      pxEllipse(ctx, 47, 43, 16, 17, '#f2b188'); // luce centrale viso
      // Guance e zigomi
      pxEllipse(ctx, 37, 47, 5, 4, '#f7c4a3');
      pxEllipse(ctx, 60, 47, 5, 4, '#d9895b');

      // Orecchio sinistro visibile
      pxEllipse(ctx, 27, 45, 4, 7, '#c77c52');
      pxEllipse(ctx, 27, 45, 2, 4, '#9c5935');

      // Basette e barba corta sale e pepe sulle guance/mascella
      for (let y = 44; y <= 65; y++) {
        for (let x = 30; x <= 68; x++) {
          const dx = (x - 49) / 20;
          const dy = (y - 46) / 22;
          const d = dx * dx + dy * dy;
          if (d <= 0.98 && d >= 0.62 && y > 47) {
            if ((x + y) % 2 === 0) {
              pxRect(ctx, x, y, 1, 1, (x * 7 + y) % 5 === 0 ? '#aeb5c2' : '#3a3538');
            }
          }
        }
      }

      // Berretto di lana verde scuro a coste (calato sopra le sopracciglia)
      pxEllipse(ctx, 48, 22, 25, 17, '#132b19'); // contorno scuro
      pxEllipse(ctx, 48, 21, 23, 15, '#255231'); // corpo berretto
      pxEllipse(ctx, 45, 17, 16, 9, '#357345');  // luce superiore
      // Risvolto grosso a coste del berretto
      pxRect(ctx, 23, 21, 50, 12, '#183821');
      pxRect(ctx, 24, 22, 48, 10, '#2d633b');
      // Coste verticali del berretto
      for (let rx = 26; rx <= 70; rx += 4) {
        pxRect(ctx, rx, 10, 1, 22, '#173620');
        pxRect(ctx, rx + 1, 12, 1, 20, '#3e8550');
      }
      // Bordo inferiore del berretto
      pxRect(ctx, 24, 31, 48, 2, '#0f2415');

      // Sopracciglia folte ed espressive
      // Sopracciglio sinistro arcuato per l'occhio gigante
      pxRect(ctx, 34, 33, 13, 3, '#1a1514');
      pxRect(ctx, 33, 35, 3, 2, '#1a1514');
      // Sopracciglio destro aggrottato
      pxRect(ctx, 54, 35, 12, 3, '#1a1514');
      pxRect(ctx, 52, 36, 3, 2, '#1a1514');

      // OCCHIO SINISTRO GIGANTE SPORGENTE (tratto iconico di Pigna!)
      pxEllipse(ctx, 41, 41, 7, 6, '#1a1412'); // contorno
      pxEllipse(ctx, 41, 41, 6, 5, '#ffffff'); // sclera grande brillante
      pxRect(ctx, 36, 38, 2, 2, '#e8f4ff');   // riflesso umido
      pxEllipse(ctx, 42, 41, 3, 3, '#4a2511'); // iride castana
      pxRect(ctx, 41, 40, 2, 2, '#090707');    // pupilla
      pxRect(ctx, 40, 39, 1, 1, '#ffffff');    // puntino luce

      // OCCHIO DESTRO NORMALE (più piccolo e socchiuso nel sorriso)
      pxRect(ctx, 55, 39, 9, 5, '#2b1d17');
      pxRect(ctx, 56, 40, 7, 3, '#ffffff');
      pxRect(ctx, 58, 40, 3, 3, '#4a2511');
      pxRect(ctx, 59, 41, 1, 1, '#090707');
      pxRect(ctx, 58, 40, 1, 1, '#ffffff');
      // Borse sotto gli occhi leggere
      pxRect(ctx, 36, 47, 9, 1, '#b86f49');
      pxRect(ctx, 56, 44, 7, 1, '#b86f49');

      // Naso pronunciato
      pxRect(ctx, 47, 40, 5, 9, '#d9895b');
      pxRect(ctx, 48, 40, 3, 8, '#f7c19e');
      pxEllipse(ctx, 49, 49, 5, 3, '#e3966b');
      pxRect(ctx, 45, 50, 2, 2, '#8c4c2b');
      pxRect(ctx, 52, 50, 2, 2, '#8c4c2b');

      // Baffoni folti scuri con sfumatura sale e pepe
      pxEllipse(ctx, 49, 54, 11, 3, '#1c1818');
      pxRect(ctx, 38, 54, 22, 3, '#262121');
      pxRect(ctx, 37, 56, 4, 2, '#1c1818');
      pxRect(ctx, 57, 56, 4, 2, '#1c1818');
      // Peli grigi nei baffi
      pxRect(ctx, 42, 54, 1, 2, '#9ca3af');
      pxRect(ctx, 53, 55, 1, 2, '#9ca3af');

      // Sorriso smagliante stile Street Fighter
      pxRect(ctx, 42, 57, 14, 3, '#ffffff');
      pxRect(ctx, 41, 57, 16, 1, '#5e241c');
      pxRect(ctx, 42, 60, 14, 1, '#a84a3e');

      // Mosca / pizzetto sotto il labbro inferiore (sale e pepe)
      pxEllipse(ctx, 49, 64, 6, 4, '#242021');
      pxRect(ctx, 46, 62, 6, 2, '#171414');
      pxRect(ctx, 45, 64, 2, 2, '#aeb5c2');
      pxRect(ctx, 51, 65, 2, 2, '#aeb5c2');
      pxRect(ctx, 48, 66, 2, 1, '#d1d5db');

      return canvas;
    }

    // Ritratto 16-bit ad altissima somiglianza (96x96 pixel) di LEGO
    // Capelli castani corti, barbetta corta curata, sorriso simpatico, giacca nera con zip,
    // gilet giallo alta visibilità fluo con banda riflettente grigia e mani gialle a C da Lego!
    function buildLegoPortraitHiRes() {
      const { canvas, ctx } = createPixelCanvas(96, 96);

      // Sfondo ritratto arcade blu/ciano
      pxRect(ctx, 0, 0, 96, 96, '#101d3b');
      for (let y = 0; y < 96; y += 4) {
        pxRect(ctx, 0, y, 96, 2, y < 48 ? '#152c59' : '#102247');
      }
      pxRect(ctx, 3, 3, 90, 90, '#0a1226');
      pxRect(ctx, 5, 5, 86, 86, '#173266');
      for (let gx = 10; gx < 88; gx += 12) pxRect(ctx, gx, 5, 1, 86, '#21458a');
      for (let gy = 10; gy < 88; gy += 12) pxRect(ctx, 5, gy, 86, 1, '#21458a');

      // Spalle e giacca tecnica nera
      pxEllipse(ctx, 48, 92, 42, 24, '#0c0e14');
      pxEllipse(ctx, 48, 92, 39, 21, '#1e222e');

      // Collo alto della giacca nera con cerniera centrale
      pxRect(ctx, 32, 60, 32, 16, '#141720');
      pxRect(ctx, 36, 58, 24, 12, '#d48d68'); // collo
      pxRect(ctx, 31, 61, 8, 13, '#252a38');  // bavero sinistro
      pxRect(ctx, 57, 61, 8, 13, '#252a38');  // bavero destro
      pxRect(ctx, 47, 68, 2, 28, '#8c96ab');  // zip metallica

      // Gilet giallo alta visibilità fluo sopra la giacca nera
      for (let y = 68; y < 96; y++) {
        const spread = Math.floor((y - 68) * 0.65);
        // Lato sinistro gilet
        pxRect(ctx, Math.max(12, 24 - spread), y, 18 + Math.floor(spread * 0.4), 1, '#d9f200');
        pxRect(ctx, Math.max(15, 27 - spread), y, 10, 1, '#f4ff3b'); // luce fluo
        // Lato destro gilet
        pxRect(ctx, 54, y, Math.min(28, 18 + Math.floor(spread * 0.4)), 1, '#d9f200');
        pxRect(ctx, 57, y, 10, 1, '#f4ff3b');
      }
      // Banda catarifrangente argento sul gilet
      pxRect(ctx, 14, 87, 26, 5, '#9ea8b8');
      pxRect(ctx, 14, 88, 26, 2, '#e2e8f0');
      pxRect(ctx, 56, 87, 26, 5, '#9ea8b8');
      pxRect(ctx, 56, 88, 26, 2, '#e2e8f0');

      // Viso di Lego (sorridente, squadrato/ovale, carnagione chiara calda)
      pxEllipse(ctx, 48, 41, 20, 22, '#915233');
      pxEllipse(ctx, 48, 40, 18, 20, '#ebaa84');
      pxEllipse(ctx, 46, 38, 14, 15, '#f7c19e');

      // Orecchie
      pxEllipse(ctx, 29, 41, 3, 6, '#d9936c');
      pxEllipse(ctx, 67, 41, 3, 6, '#d9936c');

      // Capelli castani corti con ciuffo pettinato di lato
      pxEllipse(ctx, 48, 20, 20, 10, '#2e1b10');
      pxEllipse(ctx, 48, 19, 18, 8, '#54331e');
      pxEllipse(ctx, 45, 17, 12, 4, '#73472b');
      // Attaccatura capelli e basette
      pxRect(ctx, 31, 21, 34, 5, '#472a18');
      pxRect(ctx, 34, 24, 14, 2, '#54331e');
      pxRect(ctx, 30, 25, 3, 13, '#3b2314');
      pxRect(ctx, 63, 25, 3, 13, '#3b2314');

      // Barbetta corta uniforme su guance, baffi e mento
      for (let y = 41; y <= 60; y++) {
        for (let x = 31; x <= 65; x++) {
          const dx = (x - 48) / 18;
          const dy = (y - 41) / 20;
          const d = dx * dx + dy * dy;
          if (d <= 0.96 && d >= 0.52 && y > 42) {
            if ((x + y) % 2 === 0) {
              pxRect(ctx, x, y, 1, 1, (x + y) % 4 === 0 ? '#786256' : '#4a382e');
            }
          }
        }
      }

      // Sopracciglia castane simpatiche
      pxRect(ctx, 36, 32, 9, 2, '#3b2314');
      pxRect(ctx, 51, 32, 9, 2, '#3b2314');

      // Occhi espressivi e sorridenti
      pxRect(ctx, 37, 35, 7, 4, '#ffffff');
      pxRect(ctx, 39, 35, 3, 4, '#3d2212');
      pxRect(ctx, 40, 36, 1, 1, '#000000');
      pxRect(ctx, 39, 35, 1, 1, '#ffffff');

      pxRect(ctx, 52, 35, 7, 4, '#ffffff');
      pxRect(ctx, 54, 35, 3, 4, '#3d2212');
      pxRect(ctx, 55, 36, 1, 1, '#000000');
      pxRect(ctx, 54, 35, 1, 1, '#ffffff');

      // Naso
      pxRect(ctx, 46, 36, 4, 8, '#e09870');
      pxRect(ctx, 47, 36, 2, 7, '#f7c8aa');
      pxEllipse(ctx, 48, 44, 4, 2, '#e09870');

      // Baffetti curati e sorriso aperto
      pxRect(ctx, 40, 48, 16, 2, '#4a362b');
      pxRect(ctx, 41, 50, 14, 3, '#ffffff');
      pxRect(ctx, 40, 50, 16, 1, '#6e2d23');
      pxRect(ctx, 42, 53, 12, 1, '#b55648');

      // LE DUE MANI GIALLO LEGO A FORMA DI "C" IN PRIMO PIANO!
      // Mano Lego sinistra
      pxEllipse(ctx, 32, 74, 9, 9, '#7a4b00');  // contorno
      pxEllipse(ctx, 32, 74, 8, 8, '#ffcf00');  // giallo LEGO
      pxEllipse(ctx, 31, 72, 5, 5, '#ffe853');  // riflesso lucido plastica
      pxEllipse(ctx, 34, 73, 4, 4, '#1e222e');  // incavo interno della C
      pxRect(ctx, 35, 70, 6, 6, '#1e222e');     // apertura della C
      pxRect(ctx, 27, 81, 7, 3, '#d99e00');     // polso cilindrico Lego

      // Mano Lego destra (alzata pronta al lancio)
      pxEllipse(ctx, 74, 60, 9, 9, '#7a4b00');
      pxEllipse(ctx, 74, 60, 8, 8, '#ffcf00');
      pxEllipse(ctx, 73, 58, 5, 5, '#ffe853');
      pxEllipse(ctx, 72, 59, 4, 4, '#173266');
      pxRect(ctx, 66, 56, 6, 6, '#173266');
      pxRect(ctx, 71, 67, 7, 3, '#d99e00');

      return canvas;
    }

    const PORTRAITS = {
      PIGNA: buildPignaPortraitHiRes(),
      LEGO: buildLegoPortraitHiRes()
    };

    function drawPortraitImage(ctx, fighterId, x, y, w, h, flipX = false) {
      const source = PORTRAITS[fighterId];
      if (!source) return;
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      if (flipX) {
        ctx.translate(x + w, y);
        ctx.scale(-1, 1);
        ctx.drawImage(source, 0, 0, w, h);
      } else {
        ctx.drawImage(source, x, y, w, h);
      }
      ctx.restore();
    }

    // =========================================================================
    // 3. SPRITE ANIMATI A CORPO INTERO DEI LOTTATORI (64x80 PIXEL)
    // =========================================================================
    function buildFighterSprites(type) {
      const states = [
        'idle0', 'idle1',
        'walk0', 'walk1',
        'jump', 'crouch',
        'punch', 'kick',
        'special', 'hurt', 'ko'
      ];
      const sheet = {};

      states.forEach((st) => {
        const { canvas, ctx } = createPixelCanvas(64, 80);

        if (st === 'ko') {
          // Lottatore steso a terra KO
          pxEllipse(ctx, 32, 74, 24, 4, 'rgba(0,0,0,0.45)');
          if (type === 'PIGNA') {
            pxRect(ctx, 18, 63, 24, 10, '#181a22'); // giacca pelle
            pxRect(ctx, 40, 64, 16, 8, '#28457a');  // jeans
            pxRect(ctx, 54, 63, 5, 9, '#111');      // scarponi
            pxEllipse(ctx, 13, 66, 7, 6, '#e39b70');// testa
            pxRect(ctx, 6, 61, 8, 9, '#255231');    // berretto verde
            // Stelline KO
            pxRect(ctx, 10, 54, 2, 2, '#ffd541');
            pxRect(ctx, 18, 52, 2, 2, '#ffffff');
          } else {
            pxRect(ctx, 18, 63, 24, 10, '#d9f200'); // gilet giallo
            pxRect(ctx, 40, 64, 16, 8, '#2b3342');  // pantaloni lavoro
            pxRect(ctx, 54, 63, 5, 9, '#4a2e16');   // scarponi
            pxEllipse(ctx, 13, 66, 7, 6, '#ebaa84');// testa
            pxRect(ctx, 7, 62, 6, 7, '#54331e');    // capelli castani
            pxRect(ctx, 10, 54, 2, 2, '#5ce1e6');
            pxRect(ctx, 18, 52, 2, 2, '#ffd541');
          }
          sheet[st] = canvas;
          return;
        }

        // Ombra a terra
        pxEllipse(ctx, 30, 76, 15, 3, 'rgba(0,0,0,0.45)');

        const bob = (st === 'idle1' || st === 'walk1') ? 1 : 0;
        const crouchOff = (st === 'crouch') ? 10 : 0;
        const hurtOff = (st === 'hurt') ? -3 : 0;
        const headY = 12 + bob + crouchOff;
        const torsoY = 27 + bob + crouchOff;
        const hipY = 48 + crouchOff;

        // GAMBE E SCARPE
        const legCol = type === 'PIGNA' ? '#233d6e' : '#2c3545';
        const legShade = type === 'PIGNA' ? '#17284a' : '#1b212b';
        const shoeCol = type === 'PIGNA' ? '#141418' : '#5e3b1e';

        if (st === 'kick') {
          // Gamba d'appoggio
          pxRect(ctx, 21, hipY, 7, 23, legShade);
          pxRect(ctx, 20, 71, 10, 5, shoeCol);
          // Calcio alto esteso in avanti!
          pxRect(ctx, 28, hipY - 3, 22, 7, legCol);
          pxRect(ctx, 48, hipY - 5, 9, 9, shoeCol);
          pxRect(ctx, 55, hipY - 6, 4, 11, '#ffd541'); // scia impatto
        } else if (st === 'walk0') {
          pxRect(ctx, 18, hipY, 7, 23, legShade);
          pxRect(ctx, 16, 71, 10, 5, shoeCol);
          pxRect(ctx, 32, hipY, 7, 23, legCol);
          pxRect(ctx, 32, 71, 11, 5, shoeCol);
        } else if (st === 'walk1') {
          pxRect(ctx, 28, hipY, 7, 23, legShade);
          pxRect(ctx, 28, 71, 10, 5, shoeCol);
          pxRect(ctx, 21, hipY, 7, 23, legCol);
          pxRect(ctx, 20, 71, 11, 5, shoeCol);
        } else if (st === 'jump') {
          pxRect(ctx, 19, hipY - 3, 7, 17, legShade);
          pxRect(ctx, 18, hipY + 13, 10, 5, shoeCol);
          pxRect(ctx, 31, hipY - 6, 7, 17, legCol);
          pxRect(ctx, 31, hipY + 10, 10, 5, shoeCol);
        } else if (st === 'crouch') {
          pxRect(ctx, 18, hipY, 8, 14, legShade);
          pxRect(ctx, 17, 71, 11, 5, shoeCol);
          pxRect(ctx, 30, hipY, 8, 14, legCol);
          pxRect(ctx, 30, 71, 11, 5, shoeCol);
        } else {
          // Guardia standard
          pxRect(ctx, 19, hipY, 7, 23, legShade);
          pxRect(ctx, 18, 71, 10, 5, shoeCol);
          pxRect(ctx, 31, hipY, 7, 23, legCol);
          pxRect(ctx, 31, 71, 11, 5, shoeCol);
        }

        // BUSTO E ABBIGLIAMENTO DISTINTIVO
        if (type === 'PIGNA') {
          // Chiodo in pelle nera aperto sopra la polo grigia
          pxRect(ctx, 18 + hurtOff, torsoY, 22, 22 - Math.floor(crouchOff * 0.4), '#161821');
          pxRect(ctx, 25 + hurtOff, torsoY + 1, 9, 20 - Math.floor(crouchOff * 0.4), '#8a93a3'); // polo grigia
          // Revers & borchie chiodo
          pxRect(ctx, 20 + hurtOff, torsoY + 2, 4, 11, '#2f3547');
          pxRect(ctx, 34 + hurtOff, torsoY + 2, 4, 11, '#2f3547');
          pxRect(ctx, 21 + hurtOff, torsoY + 3, 2, 2, '#e2e8f0');
          pxRect(ctx, 35 + hurtOff, torsoY + 3, 2, 2, '#e2e8f0');
          pxRect(ctx, 19 + hurtOff, torsoY + 19, 20, 3, '#3b2414'); // cintura
        } else {
          // Giacca nera + Gilet giallo alta visibilità fluo con banda riflettente
          pxRect(ctx, 18 + hurtOff, torsoY, 22, 22 - Math.floor(crouchOff * 0.4), '#181b24');
          pxRect(ctx, 20 + hurtOff, torsoY + 1, 18, 20 - Math.floor(crouchOff * 0.4), '#d9f200');
          pxRect(ctx, 22 + hurtOff, torsoY + 2, 6, 18 - Math.floor(crouchOff * 0.4), '#f4ff3b');
          pxRect(ctx, 28 + hurtOff, torsoY + 1, 2, 20 - Math.floor(crouchOff * 0.4), '#181b24'); // zip
          // Banda riflettente argento
          pxRect(ctx, 20 + hurtOff, torsoY + 13, 18, 3, '#cbd5e1');
        }

        // TESTA AD ALTA SOMIGLIANZA
        const hx = 21 + hurtOff;
        if (type === 'PIGNA') {
          // Viso + berretto verde scuro + baffoni + pizzetto + un occhio grande!
          pxEllipse(ctx, hx + 8, headY + 8, 8, 8, '#e39b70');
          // Berretto verde scuro a coste
          pxEllipse(ctx, hx + 8, headY + 2, 9, 5, '#255231');
          pxRect(ctx, hx - 1, headY + 1, 18, 4, '#2d633b');
          pxRect(ctx, hx + 2, headY + 1, 1, 4, '#173620');
          pxRect(ctx, hx + 7, headY + 1, 1, 4, '#173620');
          pxRect(ctx, hx + 12, headY + 1, 1, 4, '#173620');

          // Occhi (senza l'occhio gigante quando lo ha appena sparato!)
          if (st !== 'special') {
            // Occhio sinistro gigante sporgente
            pxRect(ctx, hx + 8, headY + 5, 5, 5, '#ffffff');
            pxRect(ctx, hx + 10, headY + 6, 2, 3, '#2b160c');
          } else {
            // Orbita vuota comica mentre l'occhio vola!
            pxRect(ctx, hx + 8, headY + 6, 4, 3, '#7a3e24');
          }
          // Occhio destro normale
          pxRect(ctx, hx + 14, headY + 6, 3, 2, '#ffffff');
          pxRect(ctx, hx + 15, headY + 6, 1, 2, '#2b160c');

          // Baffoni e pizzetto sale e pepe
          pxRect(ctx, hx + 7, headY + 11, 9, 2, '#211c1c');
          pxRect(ctx, hx + 9, headY + 14, 5, 2, '#3a3538');
          pxRect(ctx, hx + 11, headY + 14, 1, 2, '#cbd5e1');
        } else {
          // Viso di Lego + capelli castani + barbetta corta + sorriso
          pxEllipse(ctx, hx + 8, headY + 8, 8, 8, '#ebaa84');
          // Capelli castani corti
          pxEllipse(ctx, hx + 8, headY + 1, 8, 4, '#54331e');
          pxRect(ctx, hx + 1, headY + 1, 14, 3, '#472a18');
          pxRect(ctx, hx + 1, headY + 3, 2, 5, '#472a18');
          // Occhi e sopracciglia
          pxRect(ctx, hx + 8, headY + 6, 3, 2, '#ffffff');
          pxRect(ctx, hx + 9, headY + 6, 1, 2, '#3d2212');
          pxRect(ctx, hx + 13, headY + 6, 3, 2, '#ffffff');
          pxRect(ctx, hx + 14, headY + 6, 1, 2, '#3d2212');
          // Barbetta corta e sorriso
          pxRect(ctx, hx + 6, headY + 11, 9, 4, '#5e473b');
          pxRect(ctx, hx + 9, headY + 12, 5, 1, '#ffffff');
        }

        // BRACCIA E MANI
        const sleeveCol = '#181b24';
        if (type === 'PIGNA') {
          if (st === 'punch') {
            pxRect(ctx, 34, torsoY + 4, 21, 6, sleeveCol);
            pxRect(ctx, 53, torsoY + 3, 7, 7, '#e39b70'); // pugno
            pxRect(ctx, 58, torsoY + 2, 4, 9, '#ffd541'); // scia impatto
          } else if (st === 'special') {
            // Posa teatrale mentre spara l'occhio!
            pxRect(ctx, 13, torsoY + 2, 7, 10, sleeveCol);
            pxRect(ctx, 36, torsoY + 2, 13, 6, sleeveCol);
            pxRect(ctx, 48, torsoY + 1, 5, 6, '#e39b70');
          } else {
            pxRect(ctx, 15 + hurtOff, torsoY + 3, 5, 12, sleeveCol);
            pxRect(ctx, 15 + hurtOff, torsoY + 14, 5, 4, '#e39b70');
            pxRect(ctx, 36 + hurtOff, torsoY + 4, 8, 6, sleeveCol);
            pxRect(ctx, 42 + hurtOff, torsoY + 3, 6, 6, '#e39b70');
          }
        } else {
          // LEGO: mani gialle a C da minifigure (spariscono dai polsi durante "MANO-RAZZO LEGO!")
          const drawLegoClaw = (cx, cy) => {
            pxRect(ctx, cx, cy, 6, 6, '#ffcf00');
            pxRect(ctx, cx + 1, cy + 1, 2, 2, '#ffe853');
            pxRect(ctx, cx + 3, cy + 2, 3, 2, '#1e222e'); // apertura C
          };

          if (st === 'punch') {
            pxRect(ctx, 34, torsoY + 4, 19, 6, sleeveCol);
            drawLegoClaw(53, torsoY + 4);
            pxRect(ctx, 58, torsoY + 3, 4, 8, '#5ce1e6');
          } else if (st === 'special') {
            // Braccia tese in avanti SENZA mani perché le ha appena sparate!
            pxRect(ctx, 35, torsoY + 3, 16, 5, sleeveCol);
            pxRect(ctx, 35, torsoY + 10, 14, 5, sleeveCol);
            // Scintille ai polsi
            pxRect(ctx, 51, torsoY + 3, 3, 5, '#ffd541');
            pxRect(ctx, 49, torsoY + 10, 3, 5, '#ff5964');
          } else {
            pxRect(ctx, 15 + hurtOff, torsoY + 3, 5, 11, sleeveCol);
            drawLegoClaw(14 + hurtOff, torsoY + 14);
            pxRect(ctx, 36 + hurtOff, torsoY + 4, 8, 6, sleeveCol);
            drawLegoClaw(44 + hurtOff, torsoY + 3);
          }
        }

        sheet[st] = canvas;
      });

      return sheet;
    }

    const SPRITES = {
      PIGNA: buildFighterSprites('PIGNA'),
      LEGO: buildFighterSprites('LEGO')
    };

    // =========================================================================
    // 4. SFONDO CAMPO DA RUGBY ITALIANO ANNI '90 (100% PROCEDURALE)
    // =========================================================================
    function drawRugbyStage(ctx, width, height, time, camOffset = 0) {
      // Cielo tramonto dorato/viola anni '90
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.62);
      skyGrad.addColorStop(0, '#2a2359');
      skyGrad.addColorStop(0.35, '#7c3f6b');
      skyGrad.addColorStop(0.7, '#d96b43');
      skyGrad.addColorStop(1, '#f7b955');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // Nuvole pixelate al tramonto
      const cloudShift = Math.floor(time * 7) % (width + 160);
      [40, 230, 440].forEach((cx, i) => {
        const x = ((cx + cloudShift) % (width + 160)) - 80;
        const y = 24 + i * 14;
        ctx.fillStyle = '#f28b66';
        ctx.fillRect(x, y, 68, 10);
        ctx.fillStyle = '#ffcf75';
        ctx.fillRect(x + 10, y - 4, 44, 6);
      });

      // Colline piemontesi sullo sfondo (parallasse lenta)
      const hillShift = Math.round(camOffset * 0.25);
      ctx.fillStyle = '#3b335c';
      ctx.beginPath();
      ctx.moveTo(-40, 195);
      ctx.lineTo(80 + hillShift, 132);
      ctx.lineTo(220 + hillShift, 168);
      ctx.lineTo(380 + hillShift, 124);
      ctx.lineTo(540 + hillShift, 162);
      ctx.lineTo(width + 40, 138);
      ctx.lineTo(width + 40, 200);
      ctx.closePath();
      ctx.fill();

      // Torri faro dello stadio illuminate
      const towerShift = Math.round(camOffset * 0.45);
      [215, 585].forEach((tx) => {
        const x = tx + towerShift;
        ctx.fillStyle = '#1f2438';
        ctx.fillRect(x, 64, 14, 136);
        // Traliccio interno
        ctx.fillStyle = '#454e73';
        for (let ty = 72; ty < 195; ty += 14) {
          ctx.fillRect(x + 2, ty, 10, 2);
        }
        // Pannello fari
        ctx.fillStyle = '#111420';
        ctx.fillRect(x - 12, 46, 38, 22);
        ctx.fillStyle = '#fff3b0';
        for (let lx = 0; lx < 4; lx++) {
          for (let ly = 0; ly < 2; ly++) {
            ctx.fillRect(x - 8 + lx * 8, 50 + ly * 8, 6, 5);
          }
        }
      });

      // Club House in mattoni con insegna "RUGBY" sulla destra
      const clubX = 435 + Math.round(camOffset * 0.5);
      ctx.fillStyle = '#8c3b2b'; // tetto tegole
      ctx.beginPath();
      ctx.moveTo(clubX - 8, 142);
      ctx.lineTo(clubX + 68, 114);
      ctx.lineTo(clubX + 144, 142);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#b57b56'; // facciata
      ctx.fillRect(clubX, 142, 136, 58);
      // Insegna RUGBY
      ctx.fillStyle = '#2b1d16';
      ctx.fillRect(clubX + 34, 147, 68, 14);
      ctx.fillStyle = '#ffd541';
      ctx.font = '7px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('RUGBY', clubX + 68, 157);
      // Finestre e porta
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(clubX + 14, 165, 22, 18);
      ctx.fillRect(clubX + 100, 165, 22, 18);
      ctx.fillStyle = '#3b2416';
      ctx.fillRect(clubX + 56, 166, 24, 34);

      // Tribuna tifosi italiani al centro con bandiere tricolori
      const standX = 245 + Math.round(camOffset * 0.5);
      ctx.fillStyle = '#28324a';
      ctx.fillRect(standX, 144, 175, 56);
      const fanBounce = Math.sin(time * 6) > 0 ? 0 : 2;
      const fanCols = ['#0066cc', '#ffffff', '#ce2b37', '#009246', '#ffd541'];
      for (let i = 0; i < 11; i++) {
        const fx = standX + 10 + i * 15;
        const fy = 160 + (i % 2 === 0 ? fanBounce : 2 - fanBounce);
        ctx.fillStyle = fanCols[i % fanCols.length];
        ctx.fillRect(fx, fy, 10, 14);
        ctx.fillStyle = '#ebaa84';
        ctx.fillRect(fx + 2, fy - 6, 6, 6);
        // Bandierine tricolori agitate dai tifosi
        if (i % 3 === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(fx + 8, fy - 16, 2, 18);
          ctx.fillStyle = '#009246';
          ctx.fillRect(fx + 10, fy - 16, 4, 8);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(fx + 14, fy - 16, 4, 8);
          ctx.fillStyle = '#ce2b37';
          ctx.fillRect(fx + 18, fy - 16, 4, 8);
        }
      }

      // Striscioni bordo campo (Italia / Rugby)
      const fenceShift = Math.round(camOffset * 0.55);
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 192, width, 12);
      ctx.fillStyle = '#009246';
      ctx.fillRect(290 + fenceShift, 193, 28, 10);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(318 + fenceShift, 193, 28, 10);
      ctx.fillStyle = '#ce2b37';
      ctx.fillRect(346 + fenceShift, 193, 28, 10);

      // Manto erboso del campo da rugby (fasce verdi 16-bit)
      ctx.fillStyle = '#2d6a32';
      ctx.fillRect(0, 204, width, height - 204);
      ctx.fillStyle = '#38823e';
      ctx.fillRect(0, 224, width, 34);
      ctx.fillRect(0, 284, width, 38);

      // Chiazze di fango tipiche da partita di rugby
      const mudShift = Math.round(camOffset * 0.8);
      ctx.fillStyle = '#5c4028';
      [
        [140, 252, 42, 10],
        [310, 270, 56, 12],
        [480, 246, 38, 9],
        [210, 305, 48, 8]
      ].forEach(([mx, my, mw, mh]) => {
        ctx.fillRect(mx + mudShift, my, mw, mh);
      });

      // Linee bianche di gesso del campo da rugby (allineate ai piedi dei lottatori)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.fillRect(0, 220, width, 3);
      ctx.fillRect(0, 302, width, 4);

      const lineShift = Math.round(camOffset * 0.9);
      for (let lx = -40; lx <= width + 80; lx += 150) {
        const px = lx + lineShift;
        ctx.beginPath();
        ctx.moveTo(px, 204);
        ctx.lineTo(px + 5, 204);
        ctx.lineTo(px - 22, 326);
        ctx.lineTo(px - 29, 326);
        ctx.closePath();
        ctx.fill();
      }

      // Pali del rugby ad H in primo piano sulla sinistra con protezioni blu
      const postX = 115 + Math.round(camOffset * 0.65);
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(postX, 68, 5, 152);
      ctx.fillRect(postX + 48, 68, 5, 152);
      ctx.fillRect(postX, 134, 53, 5);
      // Protezioni imbottite blu alla base dei pali
      ctx.fillStyle = '#0055a5';
      ctx.fillRect(postX - 3, 184, 11, 36);
      ctx.fillRect(postX + 45, 184, 11, 36);

      // Fascia terra bordo campo in basso
      ctx.fillStyle = '#4a321d';
      ctx.fillRect(0, 326, width, height - 326);
      ctx.fillStyle = '#2e1e10';
      ctx.fillRect(0, 326, width, 3);

      // Bandierine d'angolo che sventolano
      const wave = Math.sin(time * 8) * 3;
      [20, width - 20].forEach((fx, idx) => {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(fx, 252, 3, 50);
        ctx.fillStyle = idx === 0 ? '#ce2b37' : '#009246';
        ctx.beginPath();
        ctx.moveTo(fx + 3, 252);
        ctx.lineTo(fx + 18, 258 + wave);
        ctx.lineTo(fx + 3, 266);
        ctx.closePath();
        ctx.fill();
      });
    }

    // =========================================================================
    // 5. LOGICA DEL GIOCO, PROIETTILI SPECIALI & INTELLIGENZA ARTIFICIALE
    // =========================================================================
    const GRAVITY = 0.68;
    const GROUND_Y = 304;
    const STAGE_LEFT = 46;
    const STAGE_RIGHT = 594;

    const FIGHTER_DATA = {
      PIGNA: {
        name: 'PIGNA',
        title: 'IL BOMBER DELL\'OCCHIO LUNGO',
        specialName: 'BULBO VOLANTE!',
        speed: 3.3,
        jumpForce: -12.6,
        punchDmg: 8,
        kickDmg: 12,
        specialDmg: 22,
        stats: { forza: 85, velocita: 78, follia: 99 },
        quote: '"L\'avevo visto arrivare con l\'occhio lungo!"'
      },
      LEGO: {
        name: 'LEGO',
        title: 'L\'INGEGNERE DALLE MANI A C',
        specialName: 'MANO-RAZZO LEGO!',
        speed: 3.5,
        jumpForce: -12.8,
        punchDmg: 8,
        kickDmg: 11,
        specialDmg: 22,
        stats: { forza: 80, velocita: 88, follia: 96 },
        quote: '"Non so usare le mani... ma volano che è una meraviglia!"'
      }
    };

    class Fighter {
      constructor(id, x, facing, isPlayerTwo = false) {
        this.id = id;
        this.data = FIGHTER_DATA[id];
        this.isPlayerTwo = isPlayerTwo;
        this.roundsWon = 0;
        this.reset(x, facing);
      }

      reset(x, facing) {
        this.x = x;
        this.y = GROUND_Y;
        this.vx = 0;
        this.vy = 0;
        this.facing = facing; // 1 = destra, -1 = sinistra
        this.hp = 100;
        this.displayHp = 100;
        this.state = 'idle';
        this.stateTimer = 0;
        this.animTick = 0;
        this.hitApplied = false;
        this.specialCooldown = 0;
        this.comboCount = 0;
        this.comboTimer = 0;
        this.flashTimer = 0;
      }

      get isGrounded() {
        return this.y >= GROUND_Y;
      }

      getHurtbox() {
        const h = this.state === 'crouch' ? 68 : 96;
        return {
          x: this.x - 22,
          y: this.y - h,
          w: 44,
          h: h
        };
      }

      getAttackHitbox() {
        if (this.state === 'punch' && this.stateTimer >= 5 && this.stateTimer <= 10) {
          return {
            x: this.facing === 1 ? this.x + 12 : this.x - 64,
            y: this.y - 78,
            w: 52,
            h: 24,
            damage: this.data.punchDmg,
            type: 'light'
          };
        }
        if (this.state === 'kick' && this.stateTimer >= 6 && this.stateTimer <= 13) {
          return {
            x: this.facing === 1 ? this.x + 12 : this.x - 74,
            y: this.y - 68,
            w: 62,
            h: 28,
            damage: this.data.kickDmg,
            type: 'heavy'
          };
        }
        return null;
      }

      isBlocking(opponent) {
        if (!this.isGrounded) return false;
        if (this.state !== 'walk_back' && this.state !== 'crouch') return false;
        return (opponent.x > this.x && this.facing === 1) || (opponent.x < this.x && this.facing === -1);
      }

      update(input, opponent, projectiles, effects) {
        this.animTick++;
        if (this.specialCooldown > 0) this.specialCooldown--;
        if (this.flashTimer > 0) this.flashTimer--;
        if (this.comboTimer > 0) {
          this.comboTimer--;
          if (this.comboTimer === 0) this.comboCount = 0;
        }

        if (this.displayHp > this.hp) {
          this.displayHp = Math.max(this.hp, this.displayHp - 0.9);
        }

        if (this.state === 'ko') {
          this.vy += GRAVITY;
          this.y = Math.min(GROUND_Y, this.y + this.vy);
          this.x = Math.max(STAGE_LEFT, Math.min(STAGE_RIGHT, this.x + this.vx));
          this.vx *= 0.85;
          return;
        }

        if (this.state === 'hurt') {
          this.stateTimer--;
          this.x = Math.max(STAGE_LEFT, Math.min(STAGE_RIGHT, this.x + this.vx));
          this.vx *= 0.82;
          this.vy += GRAVITY;
          this.y += this.vy;
          if (this.y >= GROUND_Y) {
            this.y = GROUND_Y;
            this.vy = 0;
          }
          if (this.stateTimer <= 0) {
            this.state = this.isGrounded ? 'idle' : 'jump';
          }
          return;
        }

        // Gestione attacchi in corso
        if (this.state === 'punch' || this.state === 'kick' || this.state === 'special') {
          this.stateTimer++;
          if (!this.isGrounded) {
            this.vy += GRAVITY;
            this.y += this.vy;
            this.x += this.vx;
          }

          // Lancio proiettile della Mossa Segreta al frame 8
          if (this.state === 'special' && this.stateTimer === 8 && !this.hitApplied) {
            this.hitApplied = true;
            this.spawnSpecialProjectile(projectiles, effects);
          }

          const maxDuration = this.state === 'punch' ? 15 : this.state === 'kick' ? 19 : 26;
          if (this.stateTimer >= maxDuration) {
            this.state = this.isGrounded ? 'idle' : 'jump';
            this.stateTimer = 0;
            this.hitApplied = false;
          }

          if (this.y >= GROUND_Y) {
            this.y = GROUND_Y;
            this.vy = 0;
          }
          this.x = Math.max(STAGE_LEFT, Math.min(STAGE_RIGHT, this.x));
          return;
        }

        // Orienta sempre verso l'avversario quando è a terra
        if (this.isGrounded) {
          this.facing = opponent.x >= this.x ? 1 : -1;
        }

        // Attacchi & Mossa Segreta
        if (input.specialPressed && this.specialCooldown === 0 && this.isGrounded) {
          this.state = 'special';
          this.stateTimer = 0;
          this.hitApplied = false;
          this.specialCooldown = 85;
          this.vx = 0;
          return;
        }

        if (input.punchPressed) {
          this.state = 'punch';
          this.stateTimer = 0;
          this.hitApplied = false;
          if (this.isGrounded) this.vx = 0;
          audio.sfxWhiff();
          return;
        }

        if (input.kickPressed) {
          this.state = 'kick';
          this.stateTimer = 0;
          this.hitApplied = false;
          if (this.isGrounded) this.vx = 0;
          audio.sfxWhiff();
          return;
        }

        // Movimento a terra e salto
        if (this.isGrounded) {
          if (input.up) {
            this.vy = this.data.jumpForce;
            this.state = 'jump';
            this.vx = input.left ? -this.data.speed * 1.1 : input.right ? this.data.speed * 1.1 : 0;
          } else if (input.down) {
            this.state = 'crouch';
            this.vx = 0;
          } else if (input.left) {
            this.vx = -this.data.speed;
            this.state = this.facing === 1 ? 'walk_back' : 'walk';
          } else if (input.right) {
            this.vx = this.data.speed;
            this.state = this.facing === -1 ? 'walk_back' : 'walk';
          } else {
            this.vx = 0;
            this.state = 'idle';
          }
        } else {
          this.state = 'jump';
        }

        this.x += this.vx;
        this.y += this.vy;
        if (!this.isGrounded) {
          this.vy += GRAVITY;
        }
        if (this.y >= GROUND_Y) {
          this.y = GROUND_Y;
          this.vy = 0;
          if (this.state === 'jump') this.state = 'idle';
        }

        this.x = Math.max(STAGE_LEFT, Math.min(STAGE_RIGHT, this.x));
      }

      spawnSpecialProjectile(projectiles, effects) {
        if (this.id === 'PIGNA') {
          audio.sfxEyeballLaunch();
          projectiles.push({
            kind: 'EYEBALL',
            owner: this,
            x: this.x + this.facing * 26,
            y: this.y - 74,
            vx: this.facing * 6.4,
            vy: 0,
            radius: 17,
            damage: this.data.specialDmg,
            spin: 0,
            life: 130
          });
          effects.push({
            type: 'callout',
            text: 'BULBO VOLANTE!',
            x: this.x,
            y: this.y - 115,
            color: '#ffef4d',
            timer: 48
          });
        } else {
          audio.sfxLegoLaunch();
          projectiles.push({
            kind: 'LEGO_HAND',
            owner: this,
            x: this.x + this.facing * 28,
            y: this.y - 72,
            vx: this.facing * 7.2,
            vy: -0.35,
            radius: 14,
            damage: Math.ceil(this.data.specialDmg * 0.58),
            spin: 0,
            life: 120
          });
          projectiles.push({
            kind: 'LEGO_HAND',
            owner: this,
            x: this.x + this.facing * 16,
            y: this.y - 50,
            vx: this.facing * 6.5,
            vy: 0.35,
            radius: 14,
            damage: Math.ceil(this.data.specialDmg * 0.58),
            spin: 1.5,
            life: 120
          });
          effects.push({
            type: 'callout',
            text: 'MANO-RAZZO LEGO!',
            x: this.x,
            y: this.y - 115,
            color: '#5ce1e6',
            timer: 48
          });
        }
      }

      getSpriteFrame() {
        const sheet = SPRITES[this.id];
        if (this.state === 'ko') return sheet.ko;
        if (this.state === 'hurt') return sheet.hurt;
        if (this.state === 'punch') return sheet.punch;
        if (this.state === 'kick') return sheet.kick;
        if (this.state === 'special') return sheet.special;
        if (this.state === 'crouch') return sheet.crouch;
        if (this.state === 'jump') return sheet.jump;
        if (this.state === 'walk' || this.state === 'walk_back') {
          return Math.floor(this.animTick / 7) % 2 === 0 ? sheet.walk0 : sheet.walk1;
        }
        return Math.floor(this.animTick / 14) % 2 === 0 ? sheet.idle0 : sheet.idle1;
      }

      draw(ctx) {
        const sprite = this.getSpriteFrame();
        const drawW = 118;
        const drawH = 148;

        ctx.save();
        ctx.translate(Math.round(this.x), Math.round(this.y));
        if (this.facing === -1) {
          ctx.scale(-1, 1);
        }

        if (this.flashTimer > 0 && this.flashTimer % 2 === 0) {
          ctx.filter = 'brightness(2.4)';
        }

        ctx.drawImage(sprite, -drawW / 2, -drawH + 6, drawW, drawH);
        ctx.restore();
      }
    }

    // =========================================================================
    // 6. GESTIONE INPUT (TASTIERA + TOUCHPAD MOBILE)
    // =========================================================================
    const keysDown = {};
    const keysJustPressed = {};
    const touchState = {
      up: false,
      down: false,
      left: false,
      right: false
    };

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (!keysDown[e.code]) {
        keysJustPressed[e.code] = true;
      }
      keysDown[e.code] = true;
      audio.init();
    });

    window.addEventListener('keyup', (e) => {
      keysDown[e.code] = false;
    });

    function consumePress(codeList) {
      for (const c of codeList) {
        if (keysJustPressed[c]) {
          keysJustPressed[c] = false;
          return true;
        }
      }
      return false;
    }

    // Collega pulsanti touch/mouse su schermo
    document.querySelectorAll('[data-key]').forEach((btn) => {
      const k = btn.getAttribute('data-key');

      const press = (ev) => {
        ev.preventDefault();
        audio.init();
        btn.classList.add('pressed');
        if (k in touchState) {
          touchState[k] = true;
        }
        keysJustPressed['TOUCH_' + k] = true;
      };

      const release = (ev) => {
        ev.preventDefault();
        btn.classList.remove('pressed');
        if (k in touchState) {
          touchState[k] = false;
        }
      };

      btn.addEventListener('touchstart', press, { passive: false });
      btn.addEventListener('touchend', release, { passive: false });
      btn.addEventListener('touchcancel', release, { passive: false });
      btn.addEventListener('mousedown', press);
      btn.addEventListener('mouseup', release);
      btn.addEventListener('mouseleave', release);
    });

    function getP1Input(singlePlayer) {
      return {
        up: keysDown['KeyW'] || (singlePlayer && keysDown['ArrowUp']) || touchState.up,
        down: keysDown['KeyS'] || (singlePlayer && keysDown['ArrowDown']) || touchState.down,
        left: keysDown['KeyA'] || (singlePlayer && keysDown['ArrowLeft']) || touchState.left,
        right: keysDown['KeyD'] || (singlePlayer && keysDown['ArrowRight']) || touchState.right,
        punchPressed: consumePress(['KeyF', 'TOUCH_punch']),
        kickPressed: consumePress(['KeyG', 'TOUCH_kick']),
        specialPressed: consumePress(['KeyH', 'TOUCH_special'])
      };
    }

    function getP2Input() {
      return {
        up: keysDown['ArrowUp'],
        down: keysDown['ArrowDown'],
        left: keysDown['ArrowLeft'],
        right: keysDown['ArrowRight'],
        punchPressed: consumePress(['KeyK', 'Numpad1', 'Digit1']),
        kickPressed: consumePress(['KeyL', 'Numpad2', 'Digit2']),
        specialPressed: consumePress(['KeyJ', 'Enter', 'Numpad3', 'Digit3'])
      };
    }

    function getCpuInput(cpu, player, projectiles) {
      const dist = Math.abs(cpu.x - player.x);
      const input = {
        up: false,
        down: false,
        left: false,
        right: false,
        punchPressed: false,
        kickPressed: false,
        specialPressed: false
      };

      const incoming = projectiles.find(
        (p) => p.owner === player && Math.abs(p.x - cpu.x) < 135
      );
      if (incoming && Math.random() < 0.08) {
        input.up = true;
        return input;
      }

      if (dist > 175 && cpu.specialCooldown === 0 && Math.random() < 0.032) {
        input.specialPressed = true;
        return input;
      }

      if (dist > 74) {
        if (player.x > cpu.x) input.right = true;
        else input.left = true;
      } else if (dist < 46 && Math.random() < 0.14) {
        if (player.x > cpu.x) input.left = true;
        else input.right = true;
      } else {
        const r = Math.random();
        if (r < 0.05) input.punchPressed = true;
        else if (r < 0.085) input.kickPressed = true;
        else if (r < 0.14) {
          if (player.x > cpu.x) input.left = true;
          else input.right = true;
        }
      }

      return input;
    }

    // =========================================================================
    // 7. MOTORE PRINCIPALE DEL GIOCO & RENDERING
    // =========================================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const game = {
      state: 'TITLE', // TITLE | ROUND_INTRO | FIGHT | ROUND_OVER | MATCH_OVER
      mode: '1P',     // 1P | 2P
      selectCursor: 0, // 0 = PIGNA, 1 = LEGO
      modeCursor: 0,   // 0 = 1P, 1 = 2P
      p1Choice: 'PIGNA',
      p2Choice: 'LEGO',
      p1: null,
      p2: null,
      round: 1,
      roundTimer: 99,
      timerFrames: 0,
      stateTimer: 0,
      hitstop: 0,
      shakeTimer: 0,
      shakeIntensity: 0,
      projectiles: [],
      effects: [],
      bannerText: '',
      bannerSub: '',
      globalTime: 0,

      startMatch() {
        this.round = 1;
        this.p1 = new Fighter(this.p1Choice, 185, 1, false);
        this.p2 = new Fighter(this.p2Choice, 455, -1, this.mode === '2P');
        this.startRound();
      },

      startRound() {
        this.p1.reset(185, 1);
        this.p2.reset(455, -1);
        this.projectiles = [];
        this.effects = [];
        this.roundTimer = 99;
        this.timerFrames = 0;
        this.state = 'ROUND_INTRO';
        this.stateTimer = 0;
        this.bannerText = `ROUND ${this.round}`;
        this.bannerSub = 'PRONTI...';
        audio.sfxRoundStart();
      },

      triggerHitstop(frames, shake = 5) {
        this.hitstop = frames;
        this.shakeTimer = frames + 4;
        this.shakeIntensity = shake;
      },

      addHitSparks(x, y, color = '#ffd541') {
        for (let i = 0; i < 8; i++) {
          const angle = (Math.PI * 2 * i) / 8 + Math.random() * 0.4;
          const spd = 2.2 + Math.random() * 3.5;
          this.effects.push({
            type: 'spark',
            x,
            y,
            vx: Math.cos(angle) * spd,
            vy: Math.sin(angle) * spd,
            color,
            timer: 14
          });
        }
      },

      rectsOverlap(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      },

      update() {
        this.globalTime += 0.016;

        if (this.shakeTimer > 0) this.shakeTimer--;
        if (this.hitstop > 0) {
          this.hitstop--;
          return;
        }

        if (this.state === 'TITLE') {
          if (consumePress(['KeyA', 'ArrowLeft', 'TOUCH_left'])) {
            this.selectCursor = 0;
            this.p1Choice = 'PIGNA';
            audio.sfxSelect();
          }
          if (consumePress(['KeyD', 'ArrowRight', 'TOUCH_right'])) {
            this.selectCursor = 1;
            this.p1Choice = 'LEGO';
            audio.sfxSelect();
          }
          if (consumePress(['KeyW', 'KeyS', 'ArrowUp', 'ArrowDown', 'TOUCH_up', 'TOUCH_down'])) {
            this.modeCursor = this.modeCursor === 0 ? 1 : 0;
            this.mode = this.modeCursor === 0 ? '1P' : '2P';
            audio.sfxSelect();
          }
          if (
            consumePress(['Enter', 'Space', 'KeyF', 'KeyG', 'KeyH', 'TOUCH_punch', 'TOUCH_kick', 'TOUCH_special'])
          ) {
            this.p2Choice = this.p1Choice === 'PIGNA' ? 'LEGO' : 'PIGNA';
            audio.sfxCoin();
            this.startMatch();
          }
        } else if (this.state === 'ROUND_INTRO') {
          this.stateTimer++;
          if (this.stateTimer === 48) {
            this.bannerText = 'FIGHT!';
            this.bannerSub = '';
          }
          if (this.stateTimer >= 82) {
            this.state = 'FIGHT';
            this.bannerText = '';
            audio.startBgm();
          }
        } else if (this.state === 'FIGHT') {
          this.updateFight();
        } else if (this.state === 'ROUND_OVER') {
          this.stateTimer++;
          this.p1.update({}, this.p2, this.projectiles, this.effects);
          this.p2.update({}, this.p1, this.projectiles, this.effects);
          this.updateEffects();

          if (this.stateTimer >= 135) {
            if (this.p1.roundsWon >= 2 || this.p2.roundsWon >= 2) {
              this.state = 'MATCH_OVER';
              this.stateTimer = 0;
              audio.stopBgm();
              audio.sfxVictory();
            } else {
              this.round++;
              this.startRound();
            }
          }
        } else if (this.state === 'MATCH_OVER') {
          this.stateTimer++;
          if (
            this.stateTimer > 55 &&
            consumePress(['Enter', 'Space', 'KeyF', 'KeyG', 'KeyH', 'TOUCH_punch', 'TOUCH_kick', 'TOUCH_special'])
          ) {
            audio.sfxSelect();
            this.state = 'TITLE';
          }
        }

        // Pulisce i tasti single-press non consumati in questo frame
        for (const k in keysJustPressed) {
          keysJustPressed[k] = false;
        }
      },

      updateFight() {
        this.timerFrames++;
        if (this.timerFrames >= 60) {
          this.timerFrames = 0;
          if (this.roundTimer > 0) this.roundTimer--;
        }

        const p1In = getP1Input(this.mode === '1P');
        const p2In =
          this.mode === '2P'
            ? getP2Input()
            : getCpuInput(this.p2, this.p1, this.projectiles);

        this.p1.update(p1In, this.p2, this.projectiles, this.effects);
        this.p2.update(p2In, this.p1, this.projectiles, this.effects);

        // Collisione fisica tra corpi per non sovrapporsi
        const minDist = 46;
        const dx = this.p2.x - this.p1.x;
        if (Math.abs(dx) < minDist && Math.abs(this.p1.y - this.p2.y) < 55) {
          const push = (minDist - Math.abs(dx)) / 2;
          const dir = dx >= 0 ? 1 : -1;
          this.p1.x = Math.max(STAGE_LEFT, this.p1.x - dir * push);
          this.p2.x = Math.min(STAGE_RIGHT, this.p2.x + dir * push);
        }

        this.checkMeleeHit(this.p1, this.p2);
        this.checkMeleeHit(this.p2, this.p1);
        this.updateProjectiles();
        this.updateEffects();

        // Controllo KO o Time Over
        if (this.p1.hp <= 0 || this.p2.hp <= 0 || this.roundTimer <= 0) {
          audio.stopBgm();
          this.state = 'ROUND_OVER';
          this.stateTimer = 0;

          if (this.p1.hp <= 0 && this.p2.hp <= 0) {
            this.p1.state = 'ko';
            this.p2.state = 'ko';
            this.bannerText = 'DOUBLE K.O.!';
            audio.sfxKO();
          } else if (this.p2.hp <= 0 || (this.roundTimer <= 0 && this.p1.hp > this.p2.hp)) {
            if (this.p2.hp <= 0) {
              this.p2.state = 'ko';
              this.p2.vx = -this.p2.facing * 6;
              this.p2.vy = -6;
              this.bannerText = 'K.O.!';
              audio.sfxKO();
            } else {
              this.bannerText = 'TIME OVER!';
            }
            this.p1.roundsWon++;
            this.bannerSub = `${this.p1.data.name} VINCE IL ROUND!`;
          } else {
            if (this.p1.hp <= 0) {
              this.p1.state = 'ko';
              this.p1.vx = -this.p1.facing * 6;
              this.p1.vy = -6;
              this.bannerText = 'K.O.!';
              audio.sfxKO();
            } else {
              this.bannerText = 'TIME OVER!';
            }
            this.p2.roundsWon++;
            this.bannerSub = `${this.p2.data.name} VINCE IL ROUND!`;
          }
        }
      },

      checkMeleeHit(attacker, defender) {
        if (attacker.hitApplied) return;
        const hitbox = attacker.getAttackHitbox();
        if (!hitbox) return;

        const hurtbox = defender.getHurtbox();
        if (this.rectsOverlap(hitbox, hurtbox)) {
          attacker.hitApplied = true;
          const hitX = (hitbox.x + hitbox.w / 2 + defender.x) / 2;
          const hitY = hitbox.y + hitbox.h / 2;

          if (defender.isBlocking(attacker)) {
            const chip = Math.max(1, Math.floor(hitbox.damage * 0.2));
            defender.hp = Math.max(0, defender.hp - chip);
            defender.vx = attacker.facing * 3.5;
            audio.sfxBlock();
            this.addHitSparks(hitX, hitY, '#5ce1e6');
            this.effects.push({
              type: 'callout',
              text: 'PARATO!',
              x: defender.x,
              y: defender.y - 96,
              color: '#5ce1e6',
              timer: 26
            });
          } else {
            defender.hp = Math.max(0, defender.hp - hitbox.damage);
            defender.state = 'hurt';
            defender.stateTimer = hitbox.type === 'heavy' ? 16 : 11;
            defender.vx = attacker.facing * (hitbox.type === 'heavy' ? 6.5 : 4.2);
            defender.flashTimer = 8;

            attacker.comboCount++;
            attacker.comboTimer = 75;

            if (hitbox.type === 'heavy') {
              audio.sfxHitHeavy();
              this.triggerHitstop(6, 7);
              this.addHitSparks(hitX, hitY, '#ff5964');
            } else {
              audio.sfxHitLight();
              this.triggerHitstop(4, 4);
              this.addHitSparks(hitX, hitY, '#ffd541');
            }
          }
        }
      },

      updateProjectiles() {
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
          const p = this.projectiles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.spin += 0.35;
          p.life--;

          // Scontro tra proiettili opposti
          let destroyed = false;
          for (let j = i - 1; j >= 0; j--) {
            const other = this.projectiles[j];
            if (other.owner !== p.owner && Math.hypot(p.x - other.x, p.y - other.y) < p.radius + other.radius) {
              this.addHitSparks((p.x + other.x) / 2, (p.y + other.y) / 2, '#ffffff');
              audio.sfxHitHeavy();
              this.projectiles.splice(i, 1);
              this.projectiles.splice(j, 1);
              i--;
              destroyed = true;
              break;
            }
          }
          if (destroyed) continue;

          const target = p.owner === this.p1 ? this.p2 : this.p1;
          const hurtbox = target.getHurtbox();
          const projBox = {
            x: p.x - p.radius,
            y: p.y - p.radius,
            w: p.radius * 2,
            h: p.radius * 2
          };

          if (this.rectsOverlap(projBox, hurtbox)) {
            if (target.isBlocking(p.owner)) {
              target.hp = Math.max(0, target.hp - 3);
              target.vx = Math.sign(p.vx) * 4;
              audio.sfxBlock();
              this.addHitSparks(p.x, p.y, '#5ce1e6');
            } else {
              target.hp = Math.max(0, target.hp - p.damage);
              target.state = 'hurt';
              target.stateTimer = 18;
              target.vx = Math.sign(p.vx) * 7.5;
              target.flashTimer = 10;
              p.owner.comboCount++;
              p.owner.comboTimer = 85;
              audio.sfxHitHeavy();
              this.triggerHitstop(7, 8);
              this.addHitSparks(p.x, p.y, p.kind === 'EYEBALL' ? '#ff5964' : '#ffcf00');
            }
            this.projectiles.splice(i, 1);
            continue;
          }

          if (p.life <= 0 || p.x < -30 || p.x > canvas.width + 30) {
            this.projectiles.splice(i, 1);
          }
        }
      },

      updateEffects() {
        for (let i = this.effects.length - 1; i >= 0; i--) {
          const ef = this.effects[i];
          ef.timer--;
          if (ef.type === 'spark') {
            ef.x += ef.vx;
            ef.y += ef.vy;
          } else if (ef.type === 'callout') {
            ef.y -= 0.7;
          }
          if (ef.timer <= 0) {
            this.effects.splice(i, 1);
          }
        }
      },

      render() {
        const w = canvas.width;
        const h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        ctx.save();
        if (this.shakeTimer > 0) {
          const sx = (Math.random() - 0.5) * this.shakeIntensity * 2;
          const sy = (Math.random() - 0.5) * this.shakeIntensity * 2;
          ctx.translate(sx, sy);
        }

        if (this.state === 'TITLE') {
          this.renderTitleScreen(w, h);
        } else {
          const midX = (this.p1.x + this.p2.x) / 2;
          const camOffset = ((w / 2) - midX) * 0.14;
          drawRugbyStage(ctx, w, h, this.globalTime, camOffset);

          this.p1.draw(ctx);
          this.p2.draw(ctx);

          this.renderProjectiles();
          this.renderEffects();
          this.renderCombatHUD(w, h);

          if (this.state === 'ROUND_INTRO' || this.state === 'ROUND_OVER') {
            this.renderBanner(w, h);
          } else if (this.state === 'MATCH_OVER') {
            this.renderVictoryScreen(w, h);
          }
        }

        ctx.restore();
      },

      renderTitleScreen(w, h) {
        // Campo da rugby in background con leggera atmosfera scura arcade

        ctx.lineWidth = 3;
        ctx.strokeRect(8, 8, w - 16, h - 16);

        // Titolo stile Street Fighter II

        titleGrad.addColorStop(1, '#e71d36');
        ctx.fillStyle = titleGrad;
        ctx.fillText('STREET FRIENDS II', w / 2, 40);

        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillStyle = '#8ef9f3';
        ctx.fillText('CHAMPION EDITION • RUGBY ARENA', w / 2, 58);

          {
            id: 'PIGNA',

            y: 70,

            h: 204,
            border: '#ffd541',
            accent: '#ff5964',

          },
          {
            id: 'LEGO',
            x: w - 270,
            y: 70,
            w: 246,
            h: 204,
            border: '#5ce1e6',
            accent: '#ffd541',
            desc: 'Spara le mani-razzo Lego!'
          }
        ];

        fighters.forEach((f, idx) => {

          ctx.lineWidth = isSelected ? 4 : 2;
          ctx.strokeRect(f.x, f.y, f.w, f.h);

          if (isSelected) {
            ctx.fillStyle = f.border;
            ctx.fillRect(f.x + 48, f.y - 8, 150, 14);
            ctx.font = '8px "Press Start 2P", monospace';
            ctx.fillStyle = '#0d1124';
            ctx.fillText('★ P1 SELEZIONATO ★', f.x + f.w / 2, f.y + 2);
          }

          // Ritratto 16-bit ad alta somiglianza
          const pSize = 114;
          const px = f.x + 12;
          const py = f.y + 14;
